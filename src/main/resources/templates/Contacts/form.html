<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'edit' ? 'Edit Contact' : 'New Contact'}">Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">
    <h1 th:text="${mode == 'edit' ? 'Edit Contact' : 'New Contact'}">Contact Form</h1>

    <form th:action="${mode == 'edit'} ? @{/contacts/{id}(id=${contactId})} : @{/contacts}"
          th:object="${contactForm}"
          method="post"
          class="mt-3">

        <div class="mb-3">
            <label class="form-label">Name <span class="text-danger">*</span></label>
            <input class="form-control" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input class="form-control" th:field="*{phone}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Fax</label>
                <input class="form-control" th:field="*{fax}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Comments</label>
            <textarea class="form-control" th:field="*{comments}" rows="3"></textarea>
        </div>

        <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/contacts}">Cancel</a>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
