<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Contacts</h1>
        <a class="btn btn-primary" th:href="@{/contacts/new}">+ New Contact</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Fax</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${contacts}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Name</td>
                <td th:text="${c.phone}">Phone</td>
                <td th:text="${c.fax}">Fax</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/contacts/{id}(id=${c.id})}">View</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/contacts/{id}/edit(id=${c.id})}">Edit</a>
                    <form th:action="@{/contacts/{id}/delete(id=${c.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                onclick="return confirm('Delete this contact?');">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(contacts)}">
                <td colspan="5" class="text-center text-muted">No contacts yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
