<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="mb-1" th:text="${contact.name}">Contact</h1>
            <p class="text-muted mb-0">Contact ID: <span th:text="${contact.id}">1</span></p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/contacts/{id}/edit(id=${contact.id})}">Edit</a>
            <a class="btn btn-outline-secondary" th:href="@{/contacts}">Back</a>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Address</dt>
                <dd class="col-sm-9" th:text="${contact.address}">-</dd>

                <dt class="col-sm-3">Phone</dt>
                <dd class="col-sm-9" th:text="${contact.phone}">-</dd>

                <dt class="col-sm-3">Fax</dt>
                <dd class="col-sm-9" th:text="${contact.fax}">-</dd>

                <dt class="col-sm-3">Comments</dt>
                <dd class="col-sm-9" th:text="${contact.comments}">-</dd>
            </dl>

            <div class="mt-3">
                <form th:action="@{/contacts/{id}/delete(id=${contact.id})}" method="post" class="d-inline">
                    <button class="btn btn-outline-danger" type="submit"
                            onclick="return confirm('Delete this contact?');">
                        Delete Contact
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
