<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #dc3545;
        }
        .error-message {
            font-size: 1.5rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Self-contained navbar to avoid fragment resolution errors during error handling -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Aardvark Insurance Accessors</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="error-container text-center">
            <div class="error-code" th:text="${status ?: '500'}">500</div>
            <h1 class="mb-3">Something went wrong</h1>
            <p class="error-message" th:text="${error ?: 'An unexpected error occurred'}">An unexpected error occurred</p>

            <div th:if="${message}" class="alert alert-secondary mt-3" role="alert">
                <small th:text="${message}"></small>
            </div>

            <div class="mt-4">
                <a th:href="@{/}" class="btn btn-primary me-2">
                    <i class="bi bi-house"></i> Go to Dashboard
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Go Back
                </button>
            </div>

            <div class="mt-5 text-muted">
                <small>
                    Timestamp: <span th:text="${timestamp}"></span><br/>
                    Path: <span th:text="${path}"></span>
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
