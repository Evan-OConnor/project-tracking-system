<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 800px;">

    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="mb-1" th:text="${employee.firstName + ' ' + employee.lastName}">Employee Name</h1>
            <p class="text-muted mb-0">Employee ID: <span th:text="${employee.id}">1</span></p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/employees/{id}/edit(id=${employee.id})}">Edit</a>
            <a class="btn btn-outline-secondary" th:href="@{/employees}">Back</a>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <dl class="row mb-0">

                <dt class="col-sm-4">Address</dt>
                <dd class="col-sm-8" th:text="${employee.address}">Galway</dd>

                <dt class="col-sm-4">Hourly Rate (€)</dt>
                <dd class="col-sm-8" th:text="${employee.hourlyRate}">25.00</dd>

                <dt class="col-sm-4">Email</dt>
                <dd class="col-sm-8" th:text="${employee.email}">example@email.com</dd>

                <dt class="col-sm-4">Phone</dt>
                <dd class="col-sm-8" th:text="${employee.phoneNumber}">123456789</dd>

            </dl>

            <div class="mt-3">
                <form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post" class="d-inline">
                    <button class="btn btn-outline-danger" type="submit"
                            onclick="return confirm('Delete this employee?');">
                        Delete Employee
                    </button>
                </form>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
