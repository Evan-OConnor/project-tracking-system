<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 800px;">

    <div class="d-flex justify-content-between align-items-start">
        <h1 class="mb-1">Employee Details</h1>
        <a class="btn btn-outline-secondary" th:href="@{/employees}">Back</a>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4">ID</dt>
                <dd class="col-sm-8" th:text="${employee.id}">1</dd>

                <dt class="col-sm-4">Name</dt>
                <dd class="col-sm-8" th:text="${employee.name}">John Doe</dd>

                <dt class="col-sm-4">Address</dt>
                <dd class="col-sm-8" th:text="${employee.address}">Galway</dd>

                <dt class="col-sm-4">Hourly Rate (€)</dt>
                <dd class="col-sm-8" th:text="${employee.hourlyRate}">25.00</dd>
            </dl>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/employees}">Back</a>
        <a class="btn btn-primary" th:href="@{/employees/{id}/edit(id=${employee.id})}">Edit</a>
        <button id="deleteBtn"
                data-id="${employee.id}"
                class="btn btn-danger">
            Delete
        </button>
    </div>

</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="appToast" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/employees/view.js}"></script>

</body>
</html>
