<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Employees</h1>
    </div>

    <!-- Search box -->
    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="Search employees by name...">
    </div>

    <div class="table-responsive">
        <table id="employeesTable" class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${employees}">
                <td th:text="${e.id}">1</td>
                <td th:text="${e.name}">John Doe</td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="2" class="text-center text-muted">No employees found.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/employees/list.js}"></script>

</body>
</html>
