<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #ffc107;
        }
    </style>
</head>
<body>
    <!-- Self-contained navbar to avoid fragment resolution errors during error handling -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Aardvark Insurance Accessors</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="error-container text-center">
            <div class="error-code">404</div>
            <h1 class="mb-3">Page Not Found</h1>
            <p class="text-muted">The page you are looking for does not exist or has been moved.</p>

            <div class="mt-4">
                <a th:href="@{/}" class="btn btn-primary me-2">Go to Dashboard</a>
                <button onclick="history.back()" class="btn btn-outline-secondary">Go Back</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
