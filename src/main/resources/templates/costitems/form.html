<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${costItemForm.id == null} ? 'Create Cost Item' : 'Edit Cost Item'">Cost Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 600px;">

    <h1 class="mb-4" th:text="${costItemForm.id == null} ? 'Create Cost Item' : 'Edit Cost Item'">Create Cost Item</h1>

    <form th:action="@{/cost-items}" th:object="${costItemForm}" method="post" novalidate>

        <!-- CSRF Token if using Spring Security -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" th:field="*{id}"/>

        <!-- Project -->
        <div class="mb-3">
            <label class="form-label">Project</label>
            <select th:field="*{projectId}" class="form-select" required>
                <option value="" disabled selected>Select a project</option>
                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.title}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('projectId')}" th:errors="*{projectId}"></div>
        </div>

        <!-- Employee -->
        <div class="mb-3">
            <label class="form-label">Employee</label>
            <select th:field="*{employeeId}" class="form-select" required>
                <option value="" disabled selected>Select an employee</option>
                <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.name}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}"></div>
        </div>

        <!-- Supplier -->
        <div class="mb-3">
            <label class="form-label">Supplier (optional)</label>
            <select th:field="*{supplierContactId}" class="form-select" id="supplierSelect">
                <option value="">-- None --</option>
                <option th:each="c : ${contacts}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" th:field="*{costDate}" class="form-control" required/>
            <div class="text-danger" th:if="${#fields.hasErrors('costDate')}" th:errors="*{costDate}"></div>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <!-- Amount -->
        <div class="mb-3">
            <label class="form-label">Amount (€)</label>
            <input type="number" step="0.01" th:field="*{costAmount}" class="form-control" required/>
            <div class="text-danger" th:if="${#fields.hasErrors('costAmount')}" th:errors="*{costAmount}"></div>
        </div>

        <!-- Type -->
        <div class="mb-3">
            <label class="form-label">Type</label>
            <select th:field="*{type}" class="form-select" id="typeSelect" required>
                <option value="" disabled selected>Select a type</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-between">
            <a class="btn btn-outline-secondary" th:href="@{/cost-items}">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>

        <div th:if="${businessError}" class="alert alert-danger">
            <span th:text="${businessError}"></span>
        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
