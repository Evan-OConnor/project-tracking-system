<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cost Item Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 800px;">

    ```
    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="d-flex justify-content-between align-items-start">

        <div>
            <h1 class="mb-1"
                th:text="${costItem.projectTitle} ?: 'N/A'">
                Project Name
            </h1>

            <div class="mt-1">
                <span class="badge bg-success" th:if="${costItem.billed}">
                 Billed
                </span>
                <span class="badge bg-secondary" th:if="${!costItem.billed}">
                   Unbilled
                </span>
                </div>


            <p class="text-muted mb-0">
                Cost Item ID:
                <span th:text="${costItem.id}">1</span>
            </p>
        </div>

        <div class="d-flex gap-2">

            <a class="btn btn-outline-primary"
               th:if="${!costItem.billed}"
               th:href="@{/cost-items/{id}/edit(id=${costItem.id})}">
                Edit
            </a>

            <button class="btn btn-outline-primary"
                    th:if="${costItem.billed}"
                    disabled>
                Edit
            </button>

            <a class="btn btn-outline-secondary"
               th:href="@{/cost-items}">
                Back
            </a>

        </div>

    </div>

    <div class="card mt-4">
        <div class="card-body">

            <dl class="row mb-0">

                <dt class="col-sm-4">Employee</dt>
                <dd class="col-sm-8"
                    th:text="${costItem.employeeName} ?: 'N/A'">
                    John Doe
                </dd>

                <dt class="col-sm-4">Supplier</dt>
                <dd class="col-sm-8"
                    th:text="${costItem.supplierContactName} ?: 'N/A'">
                    Supplier X
                </dd>

                <dt class="col-sm-4">Date</dt>
                <dd class="col-sm-8"
                    th:text="${costItem.costDate}">
                    2026-02-16
                </dd>

                <dt class="col-sm-4">Description</dt>
                <dd class="col-sm-8"
                    th:text="${costItem.description}">
                    Travel Expenses
                </dd>

                <dt class="col-sm-4">Amount (€)</dt>
                <dd class="col-sm-8"
                    th:text="${costItem.costAmount}">
                    100.00
                </dd>

                <dt class="col-sm-4">Type</dt>
                <dd class="col-sm-8"
                    th:text="${costItem.type}">
                    EXPENSE
                </dd>

            </dl>

            <!-- Delete Button -->
            <form th:if="${!costItem.billed}"
                  th:action="@{|/cost-items/${costItem.id}/delete|}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this cost item?');">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <button type="submit"
                        class="btn btn-outline-danger">
                    Delete Cost Item
                </button>

            </form>

            <button class="btn btn-outline-danger"
                    th:if="${costItem.billed}"
                    disabled>
                Delete Cost Item
            </button>

            </div>

        </div>
    </div>
    ```

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
