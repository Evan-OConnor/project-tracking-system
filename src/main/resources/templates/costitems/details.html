<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cost Item Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 800px;">

    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="mb-1" th:text="${costItem.project != null ? costItem.project.title : 'N/A'}">
                Project Name
            </h1>
            <p class="text-muted mb-0">
                Cost Item ID: <span th:text="${costItem.id}">1</span>
            </p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/cost-items/{id}/edit(id=${costItem.id})}">
                Edit
            </a>
            <a class="btn btn-outline-secondary" th:href="@{/cost-items}">Back</a>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4">Employee</dt>
                <dd class="col-sm-8" th:text="${costItem.employee != null ? costItem.employee.name : 'N/A'}">John Doe</dd>

                <dt class="col-sm-4">Supplier</dt>
                <dd class="col-sm-8" th:text="${costItem.supplierContact != null ? costItem.supplierContact.name : 'N/A'}">Supplier X</dd>

                <dt class="col-sm-4">Date</dt>
                <dd class="col-sm-8" th:text="${costItem.costDate}">2026-02-16</dd>

                <dt class="col-sm-4">Description</dt>
                <dd class="col-sm-8" th:text="${costItem.description}">Travel Expenses</dd>

                <dt class="col-sm-4">Amount (€)</dt>
                <dd class="col-sm-8" th:text="${costItem.costAmount}">100.00</dd>

                <dt class="col-sm-4">Type</dt>
                <dd class="col-sm-8" th:text="${costItem.type}">Travel</dd>
            </dl>

            <div class="mt-3">
                <button id="deleteBtn" class="btn btn-outline-danger"
                        data-id="${costItem.id}">
                    Delete Cost Item
                </button>
            </div>
        </div>
    </div>

</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="appToast" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/costitems/details.js}"></script>
</body>
</html>
