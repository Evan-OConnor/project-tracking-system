<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses & Outlays</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Expenses & Outlays</h1>
        <a class="btn btn-primary" th:href="@{/cost-items/new}">+ New Expense</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Project</th>
                <th>Employee</th>
                <th>Date</th>
                <th>Amount (€)</th>
                <th>Type</th>
                <th>Supplier</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${costItems}">
                <td th:text="${item.id}">1</td>
                <td th:text="${item.project != null ? item.project.title : 'N/A'}">Project A</td>
                <td th:text="${item.employee != null ? item.employee.name : 'N/A'}">John Doe</td>
                <td th:text="${item.costDate}">2026-02-16</td>
                <td th:text="${item.costAmount}">100.00</td>
                <td th:text="${item.type}">Travel</td>
                <td th:text="${item.supplierContact != null ? item.supplierContact.name : 'N/A'}">Supplier X</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{|/cost-items/${item.id}|}">View</a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{|/cost-items/${item.id}/edit|}">Edit</a>
                    <button type="button"
                            class="btn btn-sm btn-outline-danger delete-btn"
                            th:attr="data-id=${item.id}">
                        Delete
                    </button>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(costItems)}">
                <td colspan="8" class="text-center text-muted">
                    No expenses recorded yet.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="appToast" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/costitems/list.js}"></script>
</body>
</html>
