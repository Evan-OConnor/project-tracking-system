<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses & Outlays</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    ```
    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Expenses & Outlays</h1>
        <a class="btn btn-primary" th:href="@{/cost-items/new}">
            + New Cost Item
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">

            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Project</th>
                <th>Employee</th>
                <th>Date</th>
                <th>Amount (€)</th>
                <th>Type</th>
                <th>Supplier</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="item : ${costItems}">

                <td th:text="${item.id}">1</td>

                <td th:text="${item.projectTitle} ?: 'N/A'">
                    Project A
                </td>

                <td th:text="${item.employeeName}">
                    John Doe
                </td>

                <td th:text="${item.costDate}">
                    2026-02-16
                </td>

                <td th:text="${item.costAmount}">
                    100.00
                </td>

                <td th:text="${item.type}">
                    EXPENSE
                </td>

                <td th:text="${item.supplierContactName} ?: 'N/A'">
                    Supplier X
                </td>

                <td class="text-end">

                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{|/cost-items/${item.id}|}">
                        View
                    </a>

                    <!-- Edit (only if NOT billed) -->
                    <a class="btn btn-sm btn-outline-warning"
                       th:if="${!item.billed}"
                       th:href="@{|/cost-items/${item.id}/edit|}">
                        Edit
                    </a>

                    <!-- Disabled Edit -->
                    <button class="btn btn-sm btn-outline-warning"
                            th:if="${item.billed}"
                            disabled>
                        Edit
                    </button>

                    <!-- Delete (only if NOT billed) -->
                    <form th:if="${!item.billed}"
                          th:action="@{|/cost-items/${item.id}/delete|}"
                          method="post"
                          style="display:inline">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <button type="submit"
                                class="btn btn-sm btn-outline-danger">
                            Delete
                        </button>

                    </form>

                    <!-- Disabled Delete -->
                    <button class="btn btn-sm btn-outline-danger"
                            th:if="${item.billed}"
                            disabled>
                        Delete
                    </button>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(costItems)}">
                <td colspan="8" class="text-center text-muted py-4">
                    No expenses or outlays recorded yet.
                </td>
            </tr>

            </tbody>

        </table>
    </div>
    ```

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/costitems/list.js}"></script>

</body>
</html>
