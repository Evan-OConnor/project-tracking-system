<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Contacts</h2>
        <a class="btn btn-primary" th:href="@{/contacts/new}">
            + New Contact
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show mb-4"
         role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show mb-4"
         role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search -->
    <input type="text"
           id="searchInput"
           class="form-control mb-3"
           placeholder="Search contacts by name, ID or phone number...">

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">

            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Fax</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody id="contactsTable">

            <tr th:each="c : ${contacts}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Name</td>
                <td th:text="${c.phone}">Phone</td>
                <td th:text="${c.fax}">Fax</td>

                <td class="text-end">

                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/contacts/{id}(id=${c.id})}">
                        View
                    </a>

                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/contacts/{id}/edit(id=${c.id})}">
                        Edit
                    </a>

                    <form th:action="@{/contacts/{id}/delete(id=${c.id})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Delete this contact?');">

                        <button type="submit"
                                class="btn btn-sm btn-outline-danger">
                            Delete
                        </button>

                    </form>

                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(contacts)}">
                <td colspan="5" class="text-center text-muted">
                    No contacts yet.
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/contact/list.js}"></script>

<script>
    // Auto-hide alerts after 4 seconds
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(alert => {
            let bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 4000);
</script>

</body>
</html>
