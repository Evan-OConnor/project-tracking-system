<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .contacts-main {
            padding: 40px 0;
        }

        .contacts-header {
            margin-bottom: 1.5rem;
        }

        .projects-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }

        .projects-subtitle {
            color: #64748b;
            margin-bottom: 0;
            font-size: 1rem;
        }

        .btn-new-project {
            background: #2563eb;
            color: #fff;
            border: 1px solid #2563eb;
            border-radius: 12px;
            padding: 0.55rem 0.95rem;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
        }

        .btn-new-project:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #fff;
        }

        .contacts-search-wrap {
            max-width: 640px;
            margin-bottom: 1rem;
        }

        .contacts-search-wrap .input-group-text {
            padding: 6px 10px;
        }

        .projects-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .projects-table th {
            font-size: 0.76rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            border-bottom-color: #e5e7eb;
        }

        .projects-table th,
        .projects-table td {
            padding-top: 0.8rem;
            padding-bottom: 0.8rem;
            vertical-align: middle;
        }

        .recent-projects-name {
            font-size: 0.9rem;
        }

        .actions-wrap {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: nowrap;
        }

        .recent-view-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .recent-view-link svg {
            width: 16px;
            height: 16px;
        }

        .recent-view-link:hover {
            color: #475569;
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .action-icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #2563eb;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .action-icon-link svg {
            width: 16px;
            height: 16px;
        }

        .action-icon-link:hover {
            color: #1d4ed8;
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .delete-action-link {
            border-color: #fca5a5;
            background: #fff1f2;
            color: #b91c1c;
        }

        .delete-action-link:hover {
            color: #991b1b;
            background: #ffe4e6;
            border-color: #f87171;
        }

        @media (max-width: 767.98px) {
            .actions-wrap {
                flex-wrap: wrap;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container contacts-main">

    <section class="d-flex justify-content-between align-items-center flex-wrap contacts-header">
        <div>
            <h1 class="projects-title">Contacts</h1>
            <p class="projects-subtitle">Manage and view client, supplier, and company contacts.</p>
        </div>
        <a class="btn btn-new-project" th:href="@{/contacts/new}">
            + New Contact
        </a>
    </section>

    <!-- Flash Messages -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show mb-4"
         role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show mb-4"
         role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search -->
    <div class="contacts-search-wrap">
        <div class="input-group">
            <span class="input-group-text" id="search-addon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <input type="text"
                   id="searchInput"
                   class="form-control"
                   placeholder="Search contacts by name, ID or phone number...">
        </div>
    </div>

    <!-- Table -->
    <div class="projects-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle projects-table">

            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Fax</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody id="contactsTable">

            <tr th:each="c : ${contacts}">
                <td th:text="${c.id}">1</td>
                <td class="recent-projects-name" th:text="${c.name}">Name</td>
                <td class="recent-projects-name" th:text="${c.phone}">Phone</td>
                <td class="recent-projects-name" th:text="${c.fax}">Fax</td>

                <td class="text-end">

                    <div class="actions-wrap">
                        <a class="recent-view-link"
                           th:href="@{/contacts/{id}(id=${c.id})}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </a>

                        <a class="action-icon-link"
                           th:href="@{/contacts/{id}/edit(id=${c.id})}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                        </a>

                        <form th:action="@{/contacts/{id}/delete(id=${c.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Delete this contact?');">

                            <button type="submit"
                                    class="action-icon-link delete-action-link">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2" aria-hidden="true" focusable="false"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>

                        </form>
                    </div>

                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(contacts)}">
                <td colspan="5" class="text-center text-muted">
                    No contacts yet.
                </td>
            </tr>

            </tbody>
        </table>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/contact/list.js}"></script>

<script>
    // Auto-hide alerts after 4 seconds
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(alert => {
            let bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 4000);
</script>

</body>
</html>
