<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode != null and mode == 'edit' ? 'Edit Contact' : 'New Contact'}">
        Contact Form
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5" style="max-width: 650px;">

    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="mb-4"
                th:text="${mode != null and mode == 'edit' ? 'Edit Contact' : 'New Contact'}">
                Contact Form
            </h2>

            <!-- If the controller forgot to send contactForm, show a helpful message instead of blank page -->
            <div class="alert alert-danger" th:if="${contactForm == null}">
                Form data was not provided to the view. Please go back and try again.
            </div>

            <form th:if="${contactForm != null}"
                  th:action="${mode != null and mode == 'edit'} ? @{/contacts/{id}(id=${contactForm.id})} : @{/contacts}"
                  th:object="${contactForm}"
                  method="post"
                  novalidate>

                <!-- Global Error Message (only evaluate #fields if contactForm exists) -->
                <div class="alert alert-danger"
                     th:if="${#fields.hasErrors('*')}">
                    Please correct the errors below.
                </div>

                <!-- NAME -->
                <div class="mb-3">
                    <label class="form-label">Name *</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <!-- ADDRESS -->
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea th:field="*{address}"
                              class="form-control"
                              rows="2"
                              th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

                <!-- PHONE + FAX -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text"
                               th:field="*{phone}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}">
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fax</label>
                        <input type="text"
                               th:field="*{fax}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('fax')} ? 'is-invalid'">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('fax')}"
                             th:errors="*{fax}">
                        </div>
                    </div>
                </div>

                <!-- COMMENTS -->
                <div class="mb-3">
                    <label class="form-label">Comments</label>
                    <textarea th:field="*{comments}"
                              class="form-control"
                              rows="3"
                              th:classappend="${#fields.hasErrors('comments')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('comments')}"
                         th:errors="*{comments}">
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">
                        Save
                    </button>
                    <a class="btn btn-outline-secondary"
                       th:href="@{/contacts}">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
