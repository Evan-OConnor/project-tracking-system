<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timesheets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <h1>Timesheets</h1>

    <a class="btn btn-primary mb-3" th:href="@{/timesheet-entries/new}">New Entry</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Project</th>
            <th>Employee</th>
            <th>Description</th>
            <th>Date</th>
            <th>Hours</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${entries}">
            <td th:text="${entry.project.title}">Project</td>
            <td th:text="${entry.employee.name}">Employee</td>
            <td th:text="${entry.workDescription.name}">Description</td>
            <td th:text="${entry.entryDate}">Date</td>
            <td th:text="${entry.hours}">Hours</td>
        </tr>
        </tbody>
    </table>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
