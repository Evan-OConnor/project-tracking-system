<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Receipt</title>

    <style>

        body {
            font-family: Arial;
            margin: 40px;
        }

        .receipt-box {
            border: 1px solid #ccc;
            padding: 30px;
            max-width: 700px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
        }

        table {
            width: 100%;
            margin-top: 20px;
        }

        td {
            padding: 6px;
        }

        .total {
            font-weight: bold;
        }

    </style>

</head>

<body onload="window.print()">

<div class="receipt-box">

    <div class="title">Payment Receipt</div>

    <hr>

    <p>
        <strong>Receipt Number:</strong>
        <span th:text="${receipt.receiptNumber}"></span>
    </p>

    <p>
        <strong>Invoice Number:</strong>
        <span th:text="${receipt.invoice.invoiceNumber}"></span>
    </p>

    <p>
        <strong>Date Received:</strong>
        <span th:text="${receipt.dateReceived}"></span>
    </p>

    <p>
        <strong>Payment Method:</strong>
        <span th:text="${receipt.paymentMethod}"></span>
    </p>

    <table>

        <tr>
            <td>Discount</td>
            <td th:text="${receipt.discount}"></td>
        </tr>

        <tr class="total">
            <td>Amount Paid</td>
            <td th:text="${receipt.amountPaid}"></td>
        </tr>

    </table>

</div>

</body>
</html>
