<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Payment Receipt</title>

    <style>

        body{
            font-family: "Segoe UI", Arial, sans-serif;
            background:#f6f8fa;
            padding:40px;
            color:#333;
        }

        .receipt-container{
            background:white;
            max-width:750px;
            margin:auto;
            padding:40px;
            border-radius:8px;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .company{
            font-size:22px;
            font-weight:600;
        }

        .receipt-title{
            text-align:right;
        }

        .receipt-title h1{
            margin:0;
            font-size:30px;
            letter-spacing:1px;
        }

        .receipt-title span{
            font-size:13px;
            color:#777;
        }

        hr{
            border:none;
            border-top:1px solid #eee;
            margin:30px 0;
        }

        .details{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .detail-block{
            background:#fafafa;
            padding:15px;
            border-radius:6px;
        }

        .label{
            font-size:12px;
            color:#777;
        }

        .value{
            font-weight:600;
            margin-top:3px;
        }

        table{
            width:100%;
            margin-top:30px;
            border-collapse:collapse;
        }

        th{
            text-align:left;
            padding:12px 10px;
            font-size:13px;
            border-bottom:2px solid #eee;
            color:#666;
        }

        td{
            padding:14px 10px;
            border-bottom:1px solid #f1f1f1;
        }

        .amount{
            text-align:right;
        }

        .total{
            font-size:18px;
            font-weight:700;
        }

        .total td{
            border-top:2px solid #333;
        }

        .footer{
            margin-top:35px;
            font-size:13px;
            color:#666;
            text-align:center;
        }

        .actions{
            max-width:750px;
            margin:auto;
            margin-bottom:20px;
            display:flex;
            gap:10px;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 16px;
            border-radius:5px;
            cursor:pointer;
            font-weight:500;
        }

        button:hover{
            background:#1e4ed8;
        }

        button.secondary{
            background:#555;
        }

        button.secondary:hover{
            background:#333;
        }

        @media print{
            body{
                background:white;
                padding:0;
            }

            .receipt-container{
                box-shadow:none;
                border:none;
            }

            .no-print{
                display:none;
            }
        }

    </style>

</head>

<body>

<div class="actions no-print">
    <button onclick="window.print()">Print Receipt</button>
    <button class="secondary" onclick="history.back()">Back</button>
</div>

<div class="receipt-container">

    <div class="header">

        <div class="company">
            Project Tracking System
        </div>

        <div class="receipt-title">
            <h1>RECEIPT</h1>
            <span>Official Payment Confirmation</span>
        </div>

    </div>

    <hr>

    <div class="details">

        <div class="detail-block">
            <div class="label">Receipt Number</div>
            <div class="value" th:text="${receipt.receiptNumber}"></div>
        </div>

        <div class="detail-block">
            <div class="label">Invoice Number</div>
            <div class="value" th:text="${receipt.invoice.invoiceNumber}"></div>
        </div>

        <div class="detail-block">
            <div class="label">Date Received</div>
            <div class="value" th:text="${receipt.dateReceived}"></div>
        </div>

        <div class="detail-block">
            <div class="label">Payment Method</div>
            <div class="value" th:text="${receipt.paymentMethod}"></div>
        </div>

    </div>

    <table>

        <thead>
        <tr>
            <th>Description</th>
            <th class="amount">Amount</th>
        </tr>
        </thead>

        <tbody>

        <tr>
            <td>Discount</td>
            <td class="amount"
                th:text="'€' + ${#numbers.formatDecimal(receipt.discount,1,'COMMA',2,'POINT')}">
            </td>
        </tr>

        <tr class="total">
            <td>Amount Paid</td>
            <td class="amount"
                th:text="'€' + ${#numbers.formatDecimal(receipt.amountPaid,1,'COMMA',2,'POINT')}">
            </td>
        </tr>

        </tbody>

    </table>

    <div class="footer">
        Thank you for your payment. This receipt confirms that your payment has been successfully received.
    </div>

</div>

</body>
</html>
