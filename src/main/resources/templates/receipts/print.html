<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Receipt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @media print {
            .no-print {
                display: none;
            }
        }

        body {
            padding: 40px;
        }

        .receipt-box {
            border: 1px solid #ddd;
            padding: 30px;
            border-radius: 8px;
        }

        .receipt-header {
            margin-bottom: 30px;
        }

        .receipt-title {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container receipt-box">

    <div class="receipt-header d-flex justify-content-between">
        <div>
            <div class="receipt-title">RECEIPT</div>
            <p>Receipt ID: <strong th:text="${receipt.id}">1</strong></p>
        </div>
        <div class="text-end">
            <p><strong>Date Received:</strong></p>
            <p th:text="${receipt.dateReceived}">2026-02-18</p>
        </div>
    </div>

    <hr/>

    <div class="mb-4">
        <h5>Invoice Details</h5>
        <p>
            Invoice #:
            <strong th:text="${receipt.invoice.id}">1</strong>
        </p>
        <p>
            Project:
            <strong th:text="${receipt.invoice.project.title}">Project Title</strong>
        </p>
    </div>

    <hr/>

    <table class="table">
        <tbody>
        <tr>
            <th>Discount</th>
            <td class="text-end" th:text="'€' + ${receipt.discount}">€0.00</td>
        </tr>
        <tr>
            <th>Total Paid</th>
            <td class="text-end fw-bold" th:text="'€' + ${receipt.amountPaid}">€100.00</td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-5">
        <p>Thank you for your payment.</p>
    </div>

</div>

<div class="text-center mt-4 no-print">
    <button class="btn btn-primary" onclick="window.print()">Print</button>
    <a th:href="@{/receipts}" class="btn btn-secondary">Back</a>
</div>

</body>
</html>
