<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Receipts</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .receipts-main {
            padding: 40px 0;
        }

        .receipts-header {
            margin-bottom: 1.5rem;
        }

        .projects-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }

        .projects-subtitle {
            color: #64748b;
            margin-bottom: 0;
            font-size: 1rem;
        }

        .btn-new-project {
            background: #2563eb;
            color: #fff;
            border: 1px solid #2563eb;
            border-radius: 12px;
            padding: 0.55rem 0.95rem;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
        }

        .btn-new-project:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #fff;
        }

        .receipts-search-wrap {
            max-width: 640px;
            margin-bottom: 1rem;
        }

        .receipts-search-wrap .input-group-text {
            padding: 6px 10px;
        }

        .projects-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .projects-table {
            margin-bottom: 0;
        }

        .projects-table th {
            font-size: 0.76rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            border-bottom-color: #e5e7eb;
        }

        .projects-table th,
        .projects-table td {
            padding-top: 0.8rem;
            padding-bottom: 0.8rem;
            vertical-align: middle;
        }

        .projects-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .projects-table tbody tr:hover {
            background: #f8fafc;
        }

        .recent-projects-name {
            font-size: 0.9rem;
        }

        .actions-wrap {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: nowrap;
        }

        .recent-view-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .recent-view-link svg {
            width: 18px;
            height: 18px;
        }

        .recent-view-link:hover {
            color: #475569;
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .action-icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #2563eb;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .action-icon-link svg {
            width: 18px;
            height: 18px;
        }

        .action-icon-link:hover {
            color: #1d4ed8;
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .print-action-link {
            color: #7C3AED;
            border-color: #C4B5FD;
            background: transparent;
        }

        .print-action-link:hover {
            background: #F5F3FF;
            border-color: #A78BFA;
            color: #6D28D9;
        }

        .delete-action-link {
            border-color: #fca5a5;
            background: #fff1f2;
            color: #b91c1c;
        }

        .delete-action-link:hover {
            color: #991b1b;
            background: #ffe4e6;
            border-color: #f87171;
        }

        @media (max-width: 767.98px) {
            .actions-wrap {
                flex-wrap: wrap;
                justify-content: flex-end;
            }
        }
    </style>

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container receipts-main">

    <section class="d-flex justify-content-between align-items-center flex-wrap receipts-header">
        <div>
            <h1 class="projects-title">Receipts</h1>
            <p class="projects-subtitle">Manage and view receipts.</p>
        </div>

        <a class="btn btn-new-project"
           th:href="@{/receipts/new}">
            + Create Receipt
        </a>
    </section>

    <div class="receipts-search-wrap">
        <div class="input-group">
            <span class="input-group-text" id="search-addon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <input id="receiptSearch" type="text" class="form-control" placeholder="Search receipts...">
        </div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="projects-card">
        <div class="table-responsive">
        <table class="table table-striped align-middle projects-table">

            <thead>
            <tr>
                <th>Receipt No</th>
                <th>Invoice</th>
                <th>Date Received</th>
                <th class="text-end">Amount Paid (€)</th>
                <th>Payment Method</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="receipt : ${receipts}">

                <!-- Receipt Number -->
                <td class="recent-projects-name" th:text="${receipt.receiptNumber}"></td>

                <!-- Invoice Number -->
                <td class="recent-projects-name" th:text="${receipt.invoice.invoiceNumber}"></td>

                <!-- Date -->
                <td class="recent-projects-name" th:text="${receipt.dateReceived}"></td>

                <!-- Amount -->
                <td class="text-end recent-projects-name">
                    <span th:text="'€' + ${#numbers.formatDecimal(receipt.amountPaid,1,'COMMA',2,'POINT')}"></span>
                </td>

                <!-- Payment Method -->
                <td class="recent-projects-name" th:text="${receipt.paymentMethod}"></td>

                <!-- Actions -->
                <td class="text-end">
                    <div class="actions-wrap">
                        <a class="action-icon-link"
                           th:href="@{/receipts/{id}/edit(id=${receipt.id})}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                        </a>

                        <a class="action-icon-link print-action-link"
                           th:href="@{/receipts/{id}/pdf(id=${receipt.id})}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M6 9V2h12v7"/>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                                <rect x="6" y="14" width="12" height="8"/>
                            </svg>
                        </a>

                        <form th:action="@{/receipts/{id}/delete(id=${receipt.id})}"
                              method="post"
                              class="d-inline">

                            <button class="action-icon-link delete-action-link"
                                    onclick="return confirm('Delete this receipt?')">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                    <path d="M10 11v6"/>
                                    <path d="M14 11v6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                                    <path d="M3 6h18"/>
                                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>

                        </form>
                    </div>
                </td>

            </tr>

            <!-- Empty State -->
            <tr th:if="${#lists.isEmpty(receipts)}">
                <td colspan="6" class="text-center text-muted py-4">
                    No receipts created yet.
                </td>
            </tr>

            </tbody>

        </table>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/receipt.js}"></script>

</body>
</html>
