<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Receipts</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Receipts</h2>

        <a class="btn btn-primary"
           th:href="@{/receipts/new}">
            + Create Receipt
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-light">
            <tr>
                <th>Receipt No</th>
                <th>Invoice</th>
                <th>Date Received</th>
                <th class="text-end">Amount Paid (€)</th>
                <th>Payment Method</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="receipt : ${receipts}">

                <!-- Receipt Number -->
                <td class="fw-semibold">
                    <a th:href="@{/receipts/{id}/print(id=${receipt.id})}"
                       th:text="${receipt.receiptNumber}"
                       class="text-decoration-none">
                    </a>
                </td>

                <!-- Invoice Number -->
                <td th:text="${receipt.invoice.invoiceNumber}"></td>

                <!-- Date -->
                <td th:text="${receipt.dateReceived}"></td>

                <!-- Amount -->
                <td class="text-end">
                    <span th:text="'€' + ${#numbers.formatDecimal(receipt.amountPaid,1,'COMMA',2,'POINT')}"></span>
                </td>

                <!-- Payment Method -->
                <td th:text="${receipt.paymentMethod}"></td>

                <!-- Actions -->
                <td class="text-end">

                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/receipts/{id}/edit(id=${receipt.id})}">
                        Edit
                    </a>

                    <a class="btn btn-sm btn-outline-success"
                       th:href="@{/receipts/{id}/print(id=${receipt.id})}">
                        Print
                    </a>

                    <form th:action="@{/receipts/{id}/delete(id=${receipt.id})}"
                          method="post"
                          style="display:inline">

                        <button class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Delete this receipt?')">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            <!-- Empty State -->
            <tr th:if="${#lists.isEmpty(receipts)}">
                <td colspan="6" class="text-center text-muted py-4">
                    No receipts created yet.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/receipt.js}"></script>

</body>
</html>
