<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Receipts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Receipts</h1>
        <a class="btn btn-primary" th:href="@{/receipts/new}">+ New Receipt</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Invoice</th>
                <th>Date Received</th>
                <th>Discount (€)</th>
                <th>Amount Paid (€)</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>

            <tr th:each="r : ${receipts}">
                <td th:text="${r.id}">1</td>

                <td>
                    <span th:if="${r.invoice != null}"
                          th:text="'Invoice #' + ${r.invoice.id} + ' - ' + ${r.invoice.project.title}">
                        Invoice #1 - Project A
                    </span>
                    <span th:unless="${r.invoice != null}">N/A</span>
                </td>

                <td th:text="${r.dateReceived}">2026-02-16</td>

                <td th:text="'€' + ${#numbers.formatDecimal(r.discount, 1, 2)}">
                    €0.00
                </td>

                <td class="fw-semibold"
                    th:text="'€' + ${#numbers.formatDecimal(r.amountPaid, 1, 2)}">
                    €100.00
                </td>

                <td class="text-end">

                    <!-- Print -->
                    <a class="btn btn-outline-primary btn-sm me-1"
                       th:href="@{'/receipts/' + ${r.id} + '/print'}">
                        Print
                    </a>

                    <!-- Edit -->
                    <a class="btn btn-outline-secondary btn-sm me-1"
                       th:href="@{'/receipts/' + ${r.id} + '/edit'}">
                        Edit
                    </a>

                    <!-- Delete -->
                    <form th:action="@{'/receipts/' + ${r.id} + '/delete'}"
                          method="post"
                          style="display:inline;">
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('Are you sure you want to delete this receipt?');">
                            Delete
                        </button>
                    </form>

                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(receipts)}">
                <td colspan="6" class="text-center text-muted">
                    No receipts found.
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</div>

</body>
</html>
