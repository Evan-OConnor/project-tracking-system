<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Receipts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Receipts</h2>

    <a href="/receipts/new" class="btn btn-primary mb-3">
        Create Receipt
    </a>

    <table class="table table-bordered table-striped">

        <thead>
        <tr>
            <th>Receipt No</th>
            <th>Invoice</th>
            <th>Date Received</th>
            <th>Amount Paid</th>
            <th>Payment Method</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="receipt : ${receipts}">

            <td th:text="${receipt.receiptNumber}"></td>
            <td th:text="${receipt.invoice.invoiceNumber}"></td>
            <td th:text="${receipt.dateReceived}"></td>
            <td th:text="${receipt.amountPaid}"></td>
            <td th:text="${receipt.paymentMethod}"></td>

            <td>

                <a th:href="@{/receipts/{id}/edit(id=${receipt.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/receipts/{id}/print(id=${receipt.id})}"
                   class="btn btn-success btn-sm">
                    Print
                </a>

                <form th:action="@{/receipts/{id}/delete(id=${receipt.id})}"
                      method="post"
                      style="display:inline">

                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
