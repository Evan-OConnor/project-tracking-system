<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${receipt.id != null ? 'Edit Receipt' : 'Create Receipt'}">Receipt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5" style="max-width:650px">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0"
            th:text="${receipt.id != null ? 'Edit Receipt' : 'Create Receipt'}">
            Receipt
        </h2>

        <a class="btn btn-outline-secondary"
           th:href="@{/receipts}">
            Back to Receipts
        </a>

    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="${receipt.id} != null
        ? @{/receipts/{id}/edit(id=${receipt.id})}
        : @{/receipts}"
          th:object="${receipt}"
          method="post"
          novalidate>

        <input type="hidden" th:field="*{id}">

        <!-- Invoice -->
        <div class="mb-3">

            <label class="form-label fw-semibold">Invoice</label>

            <select id="invoiceSelect"
                    th:field="*{invoiceId}"
                    th:classappend="${#fields.hasErrors('invoiceId')} ? 'is-invalid'"
                    class="form-select"
                    th:disabled="${receipt.id != null}">

                <option value="">Select invoice</option>

                <option th:each="inv : ${invoices}"
                        th:value="${inv.id}"
                        th:text="${inv.invoiceNumber}">
                </option>

            </select>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('invoiceId')}"
                 th:errors="*{invoiceId}">
            </div>

            <input type="hidden"
                   th:field="*{invoiceId}"
                   th:if="${receipt.id != null}">

        </div>

        <!-- Invoice Total -->
        <div class="mb-3">

            <label class="form-label fw-semibold">Invoice Total</label>

            <input id="invoiceTotal"
                   class="form-control"
                   readonly>

        </div>

        <!-- Outstanding Balance -->
        <div class="mb-3">

            <label class="form-label fw-semibold">Outstanding Balance</label>

            <input id="outstandingBalance"
                   class="form-control"
                   readonly>

        </div>

        <!-- Date Received -->
        <div class="mb-3">

            <label class="form-label fw-semibold">Date Received</label>

            <input type="date"
                   th:field="*{dateReceived}"
                   th:classappend="${#fields.hasErrors('dateReceived')} ? 'is-invalid'"
                   class="form-control">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('dateReceived')}"
                 th:errors="*{dateReceived}">
            </div>

        </div>

        <!-- Discount -->
        <div class="mb-3">

            <label class="form-label fw-semibold">Discount (€)</label>

            <input type="number"
                   step="0.01"
                   min="0"
                   id="discount"
                   th:field="*{discount}"
                   th:classappend="${#fields.hasErrors('discount')} ? 'is-invalid'"
                   class="form-control">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('discount')}"
                 th:errors="*{discount}">
            </div>

        </div>

        <!-- Amount Paid -->
        <div class="mb-3">

            <label class="form-label fw-semibold">Amount Paid (€)</label>

            <input type="number"
                   step="0.01"
                   min="0"
                   id="amountPaid"
                   th:field="*{amountPaid}"
                   th:classappend="${#fields.hasErrors('amountPaid')} ? 'is-invalid'"
                   class="form-control">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('amountPaid')}"
                 th:errors="*{amountPaid}">
            </div>

        </div>

        <!-- Payment Method -->
        <div class="mb-4">

            <label class="form-label fw-semibold">Payment Method</label>

            <select th:field="*{paymentMethod}"
                    th:classappend="${#fields.hasErrors('paymentMethod')} ? 'is-invalid'"
                    class="form-select">

                <option value="">Select payment method</option>
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Credit Card">Credit Card</option>

            </select>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('paymentMethod')}"
                 th:errors="*{paymentMethod}">
            </div>

        </div>

        <div class="d-flex justify-content-between">

            <a class="btn btn-outline-secondary"
               th:href="@{/receipts}">
                Cancel
            </a>

            <button class="btn btn-primary">
                Save Receipt
            </button>

        </div>

    </form>

</main>

<script th:src="@{/js/receipt.js}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
