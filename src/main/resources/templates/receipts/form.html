<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Receipt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5" style="max-width:600px">

    <h2 class="mb-4">Receipt</h2>

    <form th:action="@{/receipts}" th:object="${receipt}" method="post">

        <input type="hidden" th:field="*{id}">

        <!-- Invoice Selection -->
        <div class="mb-3">
            <label class="form-label">Invoice</label>

            <select th:field="*{invoiceId}" class="form-select">

                <option value="">Select invoice</option>

                <option th:each="inv : ${invoices}"
                        th:value="${inv.id}"
                        th:text="${inv.invoiceNumber}">
                </option>

            </select>
        </div>

        <!-- Invoice Total (auto loaded) -->
        <div class="mb-3">
            <label class="form-label">Invoice Total</label>

            <input id="invoiceTotal"
                   class="form-control"
                   readonly>
        </div>

        <!-- Outstanding Balance -->
        <div class="mb-3">
            <label class="form-label">Outstanding Balance</label>

            <input id="outstandingBalance"
                   class="form-control"
                   readonly>
        </div>

        <!-- Date Received -->
        <div class="mb-3">
            <label class="form-label">Date Received</label>

            <input type="date"
                   th:field="*{dateReceived}"
                   class="form-control">
        </div>

        <!-- Discount -->
        <div class="mb-3">
            <label class="form-label">Discount</label>

            <input type="number"
                   step="0.01"
                   th:field="*{discount}"
                   class="form-control">
        </div>

        <!-- Amount Paid -->
        <div class="mb-3">
            <label class="form-label">Amount Paid</label>

            <input type="number"
                   step="0.01"
                   th:field="*{amountPaid}"
                   class="form-control">
        </div>

        <!-- Payment Method -->
        <div class="mb-3">

            <label class="form-label">Payment Method</label>

            <select th:field="*{paymentMethod}" class="form-select">

                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Credit Card">Credit Card</option>

            </select>

        </div>

        <button class="btn btn-primary">
            Save Receipt
        </button>

    </form>

</div>

<!-- External JS -->
<script th:src="@{/js/receipt.js}"></script>

</body>
</html>
