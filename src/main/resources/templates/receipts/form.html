<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${receipt.id == null} ? 'Create Receipt' : 'Edit Receipt'">Receipt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 600px;">

    <h1 class="mb-4" th:text="${receipt.id == null} ? 'Create Receipt' : 'Edit Receipt'">Create Receipt</h1>

    <!-- CREATE / EDIT FORM -->
    <form th:action="@{${receipt.id == null} ? '/receipts' : '/receipts/' + ${receipt.id} + '/edit'}"
          th:object="${receipt}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <!-- Invoice -->
        <div class="mb-3">
            <label class="form-label">Invoice</label>
            <select th:field="*{invoiceId}" class="form-select js-searchable" required>
                <option value="" disabled selected>Select an invoice</option>
                <option th:each="inv : ${invoices}"
                        th:value="${inv.id}"
                        th:text="'Invoice #' + ${inv.id} + ' - ' + ${inv.project.title}">
                </option>
            </select>
        </div>

        <!-- Date Received -->
        <div class="mb-3">
            <label class="form-label">Date Received</label>
            <input type="date" th:field="*{dateReceived}" class="form-control" required/>
        </div>

        <!-- Discount -->
        <div class="mb-3">
            <label class="form-label">Discount (€)</label>
            <input type="number" step="0.01" th:field="*{discount}" class="form-control" value="0.00"/>
        </div>

        <!-- Amount Paid -->
        <div class="mb-3">
            <label class="form-label">Amount Paid (€)</label>
            <input type="number" step="0.01" th:field="*{amountPaid}" class="form-control" required/>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-between mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/receipts}">Cancel</a>
            <button type="submit" class="btn btn-primary"
                    th:text="${receipt.id == null} ? 'Create Receipt' : 'Save Changes'">Create Receipt</button>
        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const selects = document.querySelectorAll('.js-searchable');
        selects.forEach(select => {
            new Choices(select, {
                searchEnabled: true,
                itemSelectText: '',
                shouldSort: false
            });
        });
    });
</script>

</body>
</html>
