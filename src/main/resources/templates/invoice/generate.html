<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Generate Invoice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5" style="max-width: 650px;">

    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="mb-4">Generate Invoice</h2>

            <form method="post" th:action="@{/invoices/generate}">

                <div class="mb-3">
                    <label class="form-label">Project</label>
                    <select name="projectId" class="form-select" required>
                        <option value="" disabled selected>Select a project</option>
                        <option th:each="p : ${projects}"
                                th:value="${p.id}"
                                th:text="${p.title}">
                        </option>
                    </select>
                </div>

                <div class="alert alert-info">
                    VAT is applied per line item based on each item's configured VAT rate.
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        Generate Invoice
                    </button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success">
                    <span th:text="${successMessage}"></span>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger">
                    <span th:text="${errorMessage}"></span>
                </div>

            </form>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
