<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Generate Invoice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5" style="max-width: 650px;">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="mb-4">Generate Invoice</h2>

            <!-- SUCCESS MESSAGE -->
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}"></span>
            </div>

            <!-- ERROR MESSAGE -->
            <div th:if="${errorMessage}" class="alert alert-danger">
                <span th:text="${errorMessage}"></span>
            </div>

            <form method="post" th:action="@{/invoices/generate}">

                <!-- CSRF Token -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <!-- PROJECT SELECT -->

                <div class="mb-3">

                    <label for="projectId" class="form-label">
                        Project
                    </label>

                    <select id="projectId"
                            name="projectId"
                            class="form-select"
                            required>

                        <option value="" disabled selected>
                            Select a project
                        </option>

                        <option th:each="p : ${projects}"
                                th:value="${p.id}"
                                th:text="${p.title}">
                        </option>

                    </select>

                </div>

                <!-- INFO MESSAGE -->

                <div class="alert alert-info">
                    VAT is applied automatically based on the VAT rate configured for each invoice line item.
                </div>

                <!-- GENERATE BUTTON -->
                <div class="d-grid mt-3">
                    <button type="submit"
                            class="btn btn-primary">
                        Generate Invoice
                    </button>
                </div>

            </form>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
