<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Invoice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}" class="no-print"></div>

<main class="container mt-5" style="max-width: 1000px;">

    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>


    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-start mb-4">

        <div>

            <h2>Invoice</h2>

            <p class="mb-0">
                Invoice No:
                <strong th:text="${invoice.invoiceNumber}"></strong>
            </p>

            <p class="mb-0">
                Invoice ID:
                <strong th:text="${invoice.invoiceId}"></strong>
            </p>

            <p class="mb-0">
                Date:
                <span th:text="${invoice.invoiceDate}"></span>
            </p>

            <p class="mb-0">
                Project:
                <span th:text="${invoice.projectName}"></span>
            </p>

            <!-- Status -->
            <p class="mt-2">

                <span class="badge bg-success"
                      th:if="${invoice.status.name() == 'PAID'}">
                    Paid
                </span>

                <span class="badge bg-warning text-dark"
                      th:if="${invoice.status.name() == 'PARTIALLY_PAID'}">
                    Partially Paid
                </span>

                <span class="badge bg-secondary"
                      th:if="${invoice.status.name() == 'GENERATED'}">
                    Generated
                </span>

            </p>

        </div>

        <div class="no-print">

            <button class="btn btn-outline-primary me-2"
                    onclick="window.print()">
                Print
            </button>

            <a class="btn btn-outline-secondary"
               th:href="@{/invoices}">
                Back
            </a>

            <form th:action="@{'/invoices/' + ${invoice.invoiceId} + '/delete'}"
                  method="post"
                  th:if="${invoice.status.name() != 'PAID' and invoice.status.name() != 'PARTIALLY_PAID'}"
                  onsubmit="return confirm('Are you sure you want to delete this invoice?');">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <button type="submit" class="btn btn-outline-danger">
                    Delete Invoice
                </button>

            </form>



        </div>

    </div>

    <!-- LINE ITEMS -->

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-bordered align-middle">

                <thead class="table-light">
                <tr>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Rate</th>
                    <th class="text-end">Net</th>
                    <th class="text-end">VAT %</th>
                    <th class="text-end">VAT</th>
                    <th class="text-end">Gross</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="item : ${invoice.lineItems}">

                    <td th:text="${item.description}"></td>

                    <td th:text="${item.quantity}"></td>

                    <td th:text="'€' + ${#numbers.formatDecimal(item.unitRate,1,'COMMA',2,'POINT')}"></td>

                    <td class="text-end"
                        th:text="'€' + ${#numbers.formatDecimal(item.netAmount,1,'COMMA',2,'POINT')}">
                    </td>

                    <td class="text-end"
                        th:text="${item.vatRatePercent + '%'}">
                    </td>

                    <td class="text-end"
                        th:text="'€' + ${#numbers.formatDecimal(item.vatAmount,1,'COMMA',2,'POINT')}">
                    </td>

                    <td class="text-end fw-semibold"
                        th:text="'€' + ${#numbers.formatDecimal(item.grossAmount,1,'COMMA',2,'POINT')}">
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(invoice.lineItems)}">

                    <td colspan="7"
                        class="text-center text-muted py-4">
                        No line items found.
                    </td>

                </tr>

                </tbody>

            </table>

            <hr>

            <!-- TOTALS -->

            <div class="row justify-content-end">

                <div class="col-md-4">

                    <p>
                        Subtotal:
                        <strong th:text="'€' + ${#numbers.formatDecimal(invoice.subtotal,1,'COMMA',2,'POINT')}"></strong>
                    </p>

                    <p>
                        VAT:
                        <strong th:text="'€' + ${#numbers.formatDecimal(invoice.vatAmount,1,'COMMA',2,'POINT')}"></strong>
                    </p>

                    <h5>
                        Total:
                        <strong th:text="'€' + ${#numbers.formatDecimal(invoice.grossTotal,1,'COMMA',2,'POINT')}"></strong>
                    </h5>

                    <hr>

                    <p>
                        Paid:
                        <strong th:text="'€' + ${#numbers.formatDecimal(invoice.totalPaid,1,'COMMA',2,'POINT')}"></strong>
                    </p>

                    <p>
                        Discounts:
                        <strong th:text="'€' + ${#numbers.formatDecimal(invoice.totalDiscount,1,'COMMA',2,'POINT')}"></strong>
                    </p>

                    <h5 class="text-danger">
                        Outstanding:
                        <strong th:text="'€' + ${#numbers.formatDecimal(invoice.outstanding,1,'COMMA',2,'POINT')}"></strong>
                    </h5>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
