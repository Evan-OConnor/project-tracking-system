<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoices</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Invoices</h2>

        <a class="btn btn-primary" th:href="@{/invoices/generate}">
            + Generate Invoice
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-light">
            <tr>
                <th>Invoice No</th>
                <th>Project</th>
                <th>Date</th>
                <th>Status</th>
                <th class="text-end">Subtotal</th>
                <th class="text-end">VAT</th>
                <th class="text-end">Total</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="inv : ${invoices}">

                <!-- Invoice Number -->
                <td class="fw-semibold">
                    <a th:href="@{/invoices/{id}(id=${inv.invoiceId})}"
                       th:text="${inv.invoiceNumber}"
                       class="text-decoration-none">
                    </a>
                </td>

                <!-- Project -->
                <td th:text="${inv.projectName}"></td>

                <!-- Date -->
                <td th:text="${inv.invoiceDate}"></td>

                <!-- Status -->
                <td>

                    <span class="badge bg-success"
                          th:if="${inv.status.name() == 'PAID'}">
                        Paid
                    </span>

                    <span class="badge bg-warning text-dark"
                          th:if="${inv.status.name() == 'GENERATED'}">
                        Generated
                    </span>

                    <span class="badge bg-info text-dark"
                          th:if="${inv.status.name() == 'SENT'}">
                        Sent
                    </span>

                    <span class="badge bg-danger"
                          th:if="${inv.status.name() == 'CANCELLED'}">
                        Cancelled
                    </span>

                </td>

                <!-- Subtotal -->
                <td class="text-end"
                    th:text="'€' + ${#numbers.formatDecimal(inv.subtotal,1,'COMMA',2,'POINT')}">
                </td>

                <!-- VAT -->
                <td class="text-end"
                    th:text="'€' + ${#numbers.formatDecimal(inv.vatAmount,1,'COMMA',2,'POINT')}">
                </td>

                <!-- Total -->
                <td class="text-end fw-semibold"
                    th:text="'€' + ${#numbers.formatDecimal(inv.grossTotal,1,'COMMA',2,'POINT')}">
                </td>

                <!-- Actions -->
                <td class="text-end">

                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/invoices/{id}(id=${inv.invoiceId})}">
                        View
                    </a>

                </td>

            </tr>

            <!-- Empty State -->
            <tr th:if="${#lists.isEmpty(invoices)}">
                <td colspan="8" class="text-center text-muted py-4">
                    No invoices generated yet.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/invoice/list.js}"></script>

</body>
</html>
