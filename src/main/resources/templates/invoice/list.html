<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoices</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .invoices-main {
            padding: 40px 0;
        }

        .invoices-header {
            margin-bottom: 1.5rem;
        }

        .projects-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }

        .projects-subtitle {
            color: #64748b;
            margin-bottom: 0;
            font-size: 1rem;
        }

        .btn-new-project {
            background: #2563eb;
            color: #fff;
            border: 1px solid #2563eb;
            border-radius: 12px;
            padding: 0.55rem 0.95rem;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
        }

        .btn-new-project:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #fff;
        }

        .invoices-search-wrap {
            max-width: 640px;
            margin-bottom: 1rem;
        }

        .invoices-search-wrap .input-group-text {
            padding: 6px 10px;
        }

        .projects-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .projects-table {
            margin-bottom: 0;
        }

        .projects-table th {
            font-size: 0.76rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            border-bottom-color: #e5e7eb;
        }

        .projects-table th,
        .projects-table td {
            padding-top: 0.8rem;
            padding-bottom: 0.8rem;
            vertical-align: middle;
        }

        .projects-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .projects-table tbody tr:hover {
            background: #f8fafc;
        }

        .project-title-cell {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-projects-name {
            font-size: 0.9rem;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.18rem 0.6rem;
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .badge-active {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-cancelled {
            background: #ffe4d6;
            color: #c2410c;
        }

        .actions-wrap {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: nowrap;
        }

        .recent-view-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .recent-view-link svg {
            width: 16px;
            height: 16px;
        }

        .recent-view-link:hover {
            color: #475569;
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .action-icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #2563eb;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .action-icon-link svg {
            width: 18px;
            height: 18px;
        }

        .action-hidden {
            visibility: hidden;
            pointer-events: none;
        }

        .action-icon-link:hover {
            color: #1d4ed8;
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .pay-action-link {
            color: #16A34A;
            border-color: #16A34A;
            background: transparent;
        }

        .print-action-link {
            color: #7C3AED;
            border-color: #C4B5FD;
            background: transparent;
        }

        .print-action-link:hover {
            background: #F5F3FF;
            border-color: #A78BFA;
            color: #6D28D9;
        }

        .cover-letter-action-link {
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #ea580c;
        }

        .cover-letter-action-link:hover {
            background: #ffedd5;
            border-color: #fb923c;
            color: #c2410c;
        }

        .pay-action-link:hover {
            color: #15803D;
            background: #DCFCE7;
            border-color: #15803D;
        }

        .delete-action-link {
            border-color: #fca5a5;
            background: #fff1f2;
            color: #b91c1c;
        }

        .delete-action-link:hover {
            color: #991b1b;
            background: #ffe4e6;
            border-color: #f87171;
        }

        @media (max-width: 767.98px) {
            .project-title-cell {
                max-width: 140px;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container invoices-main">

    <!-- Header -->
    <section class="d-flex justify-content-between align-items-center flex-wrap invoices-header">
        <div>
            <h1 class="projects-title">Invoices</h1>
            <p class="projects-subtitle">Manage and view invoices.</p>
        </div>
        <a class="btn btn-new-project" th:href="@{/invoices/generate}">+ Generate Invoice</a>
    </section>

    <div class="invoices-search-wrap">
        <div class="input-group">
            <span class="input-group-text" id="search-addon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <input type="text"
                   id="invoiceSearch"
                   class="form-control"
                   placeholder="Search by invoice number or project title...">
            <input type="hidden" name="invoiceId" id="invoiceId">
        </div>
        <div id="invoiceResults" class="list-group mt-1"></div>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="projects-card">
        <div class="table-responsive">
        <table id="invoicesTable" class="table table-striped align-middle projects-table">

            <thead>
            <tr>
                <th>Invoice No</th>
                <th>Project</th>
                <th>Date</th>
                <th>Status</th>
                <th class="text-end">Subtotal</th>
                <th class="text-end">VAT</th>
                <th class="text-end">Total</th>
                <th class="text-end">Paid</th>
                <th class="text-end">Outstanding</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="inv : ${invoices}">

                <!-- Invoice Number -->
                <td class="recent-projects-name">
                    <span th:text="${inv.invoiceNumber}"></span>
                </td>

                <!-- Project -->
                <td class="project-title-cell recent-projects-name"
                    th:text="${inv.projectName}"
                    th:title="${inv.projectName}"></td>

                <!-- Date -->
                <td class="recent-projects-name" th:text="${inv.invoiceDate}"></td>

                <!-- Status -->
                <td>

                    <span class="status-pill badge-active"
                          th:if="${inv.status != null and inv.status.name() == 'GENERATED'}">
                        GENERATED
                    </span>

                    <span class="status-pill badge-cancelled"
                          th:if="${inv.status != null and inv.status.name() == 'PARTIALLY_PAID'}">
                        PARTIALLY PAID
                    </span>

                    <span class="status-pill badge-completed"
                          th:if="${inv.status != null and inv.status.name() == 'PAID'}">
                        PAID
                    </span>

                    <span class="status-pill badge-cancelled"
                          th:if="${inv.status != null and inv.status.name() == 'VOID'}">
                        VOID
                    </span>

                </td>

                <!-- Subtotal -->
                <td class="text-end recent-projects-name"
                    th:text="'€' + ${#numbers.formatDecimal(inv.subtotal,1,'COMMA',2,'POINT')}">
                </td>

                <!-- VAT -->
                <td class="text-end recent-projects-name"
                    th:text="'€' + ${#numbers.formatDecimal(inv.vatAmount,1,'COMMA',2,'POINT')}">
                </td>

                <!-- Total -->
                <td class="text-end recent-projects-name"
                    th:text="'€' + ${#numbers.formatDecimal(inv.grossTotal,1,'COMMA',2,'POINT')}">
                </td>

                <!-- Paid -->
                <td class="text-end recent-projects-name"
                    th:text="'€' + ${#numbers.formatDecimal(inv.totalPaid,1,'COMMA',2,'POINT')}">
                </td>

                <!-- Outstanding -->
                <td class="text-end recent-projects-name"
                    th:text="'€' + ${#numbers.formatDecimal(inv.outstanding,1,'COMMA',2,'POINT')}">
                </td>

                <!-- Actions -->
                <td class="text-end">

                    <div class="actions-wrap">
                    <a class="recent-view-link"
                       th:href="@{/invoices/{id}(id=${inv.invoiceId})}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </a>

                    <a class="action-icon-link pay-action-link"
                       th:classappend="${inv.outstanding > 0} ? '' : ' action-hidden'"
                       th:href="@{/receipts/new(invoiceId=${inv.invoiceId})}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card" aria-hidden="true" focusable="false">
                            <rect width="20" height="14" x="2" y="5" rx="2"/>
                            <line x1="2" x2="22" y1="10" y2="10"/>
                        </svg>
                    </a>

                    <a class="action-icon-link print-action-link"
                       th:href="@{/invoices/{id}/pdf(id=${inv.invoiceId})}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M6 9V2h12v7"/>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                            <rect x="6" y="14" width="12" height="8"/>
                        </svg>
                    </a>

                    <a class="action-icon-link cover-letter-action-link"
                       th:href="@{/invoices/{id}/cover-letter/pdf(id=${inv.invoiceId})}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail-icon lucide-mail" aria-hidden="true" focusable="false"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
                    </a>

                    <form th:action="@{/invoices/{id}/delete(id=${inv.invoiceId})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Are you sure you want to void this invoice?');">

                        <!-- CSRF Token -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <button type="submit"
                                class="action-icon-link delete-action-link">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-x" aria-hidden="true" focusable="false">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="m15 9-6 6"/>
                                <path d="m9 9 6 6"/>
                            </svg>
                        </button>
                    </form>
                    </div>

                </td>

            </tr>

            <!-- Empty State -->
            <tr th:if="${#lists.isEmpty(invoices)}">
                <td colspan="10" class="text-center text-muted py-4">
                    No invoices generated yet.
                </td>
            </tr>

            </tbody>

        </table>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/invoice/list.js}"></script>

</body>
</html>
