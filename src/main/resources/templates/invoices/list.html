<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Invoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Invoices</h1>
        <a class="btn btn-primary" th:href="@{/invoices/new}">+ New Invoice</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Project</th>
                <th>VAT Rate</th>
                <th>Invoice Date</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="invoice : ${invoices}">
                <td th:text="${invoice.id}">1</td>
                <td th:text="${invoice.project != null ? invoice.project.title : 'N/A'}">Project A</td>
                <td th:text="${invoice.vatRate != null ? invoice.vatRate.ratePercent + '%' : 'N/A'}">23%</td>
                <td th:text="${invoice.invoiceDate}">2026-02-16</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-warning" th:href="@{|/invoices/${invoice.id}/edit|}">Edit</a>
                    <form th:action="@{|/invoices/${invoice.id}/delete|}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Are you sure you want to delete this invoice?');">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(invoices)}">
                <td colspan="5" class="text-center text-muted">
                    No invoices recorded yet.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
