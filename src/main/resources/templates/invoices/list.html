<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Invoices</h1>
        <a class="btn btn-primary" th:href="@{/invoices/new}">+ New Invoice</a>
    </div>

    <!-- Search box -->
    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by project...">
    </div>

    <div class="table-responsive">
        <table id="invoicesTable" class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Project</th>
                <th>VAT Rate</th>
                <th class="text-end">Net Total (€)</th>
                <th class="text-end">VAT (€)</th>
                <th class="text-end">Gross Total (€)</th>
                <th class="text-end">Discount (€)</th>
                <th class="text-end">Amount Paid (€)</th>
                <th class="text-end">Outstanding (€)</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="invoice : ${invoices}">
                <td th:text="${invoice.id}">1</td>
                <td th:text="${invoice.project != null ? invoice.project.title : 'N/A'}">Project A</td>
                <td th:text="${invoice.vatRate != null ? invoice.vatRate.ratePercent + '%' : 'N/A'}">23%</td>
                <td class="text-end" th:text="${invoice.netTotal}">100.00</td>
                <td class="text-end" th:text="${invoice.vatTotal}">23.00</td>
                <td class="text-end" th:text="${invoice.grossTotal}">123.00</td>
                <td class="text-end" th:text="${invoice.discount}">0.00</td>
                <td class="text-end" th:text="${invoice.amountPaid}">100.00</td>
                <td class="text-end" th:text="${invoice.outstandingAmount}">23.00</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/invoices/{id}/view(id=${invoice.id})}">View</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/invoices/{id}/edit(id=${invoice.id})}">Edit</a>
                    <a class="btn btn-sm btn-outline-info" th:href="@{/invoices/{id}/print(id=${invoice.id})}" target="_blank">Print</a>
                    <button type="button" class="btn btn-sm btn-outline-danger delete-btn" th:data-id="${invoice.id}">Delete</button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(invoices)}">
                <td colspan="10" class="text-center text-muted">No invoices yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="appToast" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
