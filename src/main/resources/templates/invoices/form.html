<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Invoice Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1 th:text="${invoice.id} != null ? 'Edit Invoice' : 'New Invoice'"></h1>

<form th:object="${invoice}" th:action="@{/invoices}" method="post">
    <input type="hidden" th:field="*{id}" />

    <!-- Project -->
    <label for="projectId">Project:</label>
    <select th:field="*{projectId}" id="projectId">
        <option value="">-- Select Project --</option>
        <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"></option>
    </select>

    <!-- VAT Rate -->
    <label for="vatRateId">VAT Rate:</label>
    <select th:field="*{vatRateId}" id="vatRateId">
        <option value="">-- Select VAT Rate --</option>
        <option th:each="v : ${vatRates}" th:value="${v.id}" th:text="${v.rate}"></option>
    </select>

    <!-- Invoice Date -->
    <label for="invoiceDate">Invoice Date:</label>
    <input type="date" th:field="*{invoiceDate}" id="invoiceDate" />

    <hr/>

    <!-- Line Items -->
    <h3>Line Items</h3>
    <div th:each="item, iterStat : *{items}">
        <label>Description:</label>
        <input type="text" th:field="*{items[__${iterStat.index}__].description}" placeholder="Description" />

        <label>Details:</label>
        <input type="text" th:field="*{items[__${iterStat.index}__].details}" placeholder="Details" />

        <label>Quantity:</label>
        <input type="number" th:field="*{items[__${iterStat.index}__].quantity}" step="0.01"/>

        <label>Unit Rate:</label>
        <input type="number" th:field="*{items[__${iterStat.index}__].unitRate}" step="0.01"/>

        <label>Total:</label>
        <input type="number" th:field="*{items[__${iterStat.index}__].total}" step="0.01" readonly />

        <hr/>
    </div>

    <!-- Receipt -->
    <h3>Receipt</h3>
    <label>Amount Paid:</label>
    <input type="number" th:field="*{receipt.amountPaid}" step="0.01" />

    <label>Discount:</label>
    <input type="number" th:field="*{receipt.discount}" step="0.01" />

    <hr/>

    <button type="submit">Save Invoice</button>
    <a th:href="@{/invoices/list}">Cancel</a>
</form>
</body>
</html>
