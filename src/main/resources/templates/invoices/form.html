<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${invoice.id == null} ? 'Create Invoice' : 'Edit Invoice'">Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 600px;">

    <h1 class="mb-4" th:text="${invoice.id == null} ? 'Create Invoice' : 'Edit Invoice'">Create Invoice</h1>

    <form th:action="@{/invoices}" th:object="${invoice}" method="post">

        <input type="hidden" th:field="*{id}"/>

        <!-- Project -->
        <div class="mb-3">
            <label class="form-label">Project</label>
            <select th:field="*{projectId}" class="form-select js-searchable" required>
                <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.title}"></option>
            </select>
        </div>

        <!-- VAT Rate -->
        <div class="mb-3">
            <label class="form-label">VAT Rate</label>
            <select th:field="*{vatRateId}" class="form-select js-searchable" required>
                <option th:each="v : ${vatRates}" th:value="${v.id}" th:text="${v.ratePercent} + '%'"></option>
            </select>
        </div>

        <!-- Invoice Date -->
        <div class="mb-3">
            <label class="form-label">Invoice Date</label>
            <input type="date" th:field="*{invoiceDate}" class="form-control" required/>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-between">
            <a class="btn btn-outline-secondary" th:href="@{/invoices}">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const selects = document.querySelectorAll('.js-searchable');
        selects.forEach(select => {
            new Choices(select, {
                searchEnabled: true,
                itemSelectText: '',
                shouldSort: false
            });
        });
    });
</script>

</body>
</html>
