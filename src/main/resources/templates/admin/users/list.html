<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
    body {
      background: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .users-main {
      padding: 40px 0;
    }

    .users-header {
      margin-bottom: 1.5rem;
    }

    .projects-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.35rem;
    }

    .projects-subtitle {
      color: #64748b;
      margin-bottom: 0;
      font-size: 1rem;
    }

    .btn-new-project {
      background: #2563eb;
      color: #fff;
      border: 1px solid #2563eb;
      border-radius: 12px;
      padding: 0.55rem 0.95rem;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
    }

    .btn-new-project:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #fff;
    }

    .projects-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .projects-table {
      margin-bottom: 0;
    }

    .projects-table th {
      font-size: 0.76rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
      border-bottom-color: #e5e7eb;
    }

    .projects-table th,
    .projects-table td {
      padding-top: 0.8rem;
      padding-bottom: 0.8rem;
      vertical-align: middle;
    }

    .projects-table tbody tr {
      transition: background-color 0.15s ease;
    }

    .projects-table tbody tr:hover {
      background: #f8fafc;
    }

    .recent-projects-name {
      font-size: 0.9rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.18rem 0.6rem;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-active {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-inactive {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-completed {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .action-icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 10px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #2563eb;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .action-icon-link svg {
      width: 16px;
      height: 16px;
    }

    .action-icon-link:hover {
      color: #1d4ed8;
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .delete-action-link {
      border-color: #fca5a5;
      background: #fff1f2;
      color: #b91c1c;
    }

    .delete-action-link:hover {
      color: #991b1b;
      background: #ffe4e6;
      border-color: #f87171;
    }

    .actions-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
      margin-left: 2rem;
    }

    .users-pagination {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container users-main">
  <section class="d-flex justify-content-between align-items-center flex-wrap users-header">
    <div>
      <h1 class="projects-title">Users</h1>
      <p class="projects-subtitle">Manage and view users.</p>
    </div>
    <a class="btn btn-new-project" th:href="@{/admin/users/new}">+ Create User</a>
  </section>

  <!-- flash success message -->
  <div th:if="${message}" class="alert alert-primary alert-dismissible fade show d-flex align-items-center" role="alert">
    <span th:if="${message.contains(': ')}" th:utext="${message.substring(0, message.lastIndexOf(': ') + 2) + '<strong>' + message.substring(message.lastIndexOf(': ') + 2) + '</strong>'}"></span>
    <span th:if="!${message.contains(': ')}" th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <!-- flash error message -->
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <form class="mb-3" th:action="@{/admin/users}" method="get" role="search" style="max-width:640px;">
    <div class="input-group">
      <span class="input-group-text" id="search-addon" aria-hidden="true" style="padding:6px 10px;">
        <!-- inline magnifying-glass SVG (small, no external dependency) -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>

      <input class="form-control" type="search" name="q" placeholder="Search users by username or employee name..." aria-label="Search users" th:value="${q}" />

      <button class="btn btn-outline-primary" type="submit" aria-label="Submit search">Search</button>

      <a class="btn btn-outline-dark" th:if="${q}" th:href="@{/admin/users}" aria-label="Clear search">Clear</a>
    </div>
    <div th:if="${q}" class="form-text text-muted mt-1">Showing results for: <strong th:text="${q}"></strong></div>
  </form>

  <div class="projects-card">
  <table class="table table-striped align-middle projects-table">
    <thead>
    <tr>
      <th>Username</th>
      <th>Employee</th>
      <th>Role</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
      <td class="recent-projects-name" th:text="${u.username}">U000000</td>
      <td class="recent-projects-name" th:text="${u.employee.name}">Employee Name</td>
      <td class="recent-projects-name" th:text="${u.role.name}">Role</td>
      <td class="recent-projects-name">
        <span class="status-pill" th:classappend="${u.active} ? ' badge-active' : ' badge-inactive'" th:text="${u.active} ? 'ACTIVE' : 'INACTIVE'" role="status" aria-live="polite"></span>
      </td>
      <td>
        <span th:if="${u.username == seededAdminUsername}" class="status-pill badge-completed">SYSTEM ADMIN</span>
        <div th:if="${u.username != seededAdminUsername}" class="actions-wrap">
          <a class="action-icon-link" th:href="@{/admin/users/edit(employeeId=${u.employee.id})}">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
          </a>

          <form th:action="@{/admin/users/delete}" method="post" class="d-inline" onsubmit="return confirm('Delete this employee and account?');">
            <input type="hidden" name="employeeId" th:value="${u.employee.id}" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="action-icon-link delete-action-link">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2" aria-hidden="true" focusable="false"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
  </div>

  <!-- Pagination controls -->
  <nav th:if="${usersPage.totalPages > 1}" aria-label="User list pagination" class="users-pagination">
    <ul class="pagination justify-content-center">
      <!-- Previous button -->
      <li class="page-item" th:classappend="${usersPage.first} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/users(q=${q}, page=${usersPage.number - 1})}" th:if="${!usersPage.first}">Previous</a>
        <span class="page-link" th:if="${usersPage.first}">Previous</span>
      </li>

      <!-- Page numbers -->
      <li class="page-item" th:each="i : ${#numbers.sequence(0, usersPage.totalPages - 1)}" th:classappend="${i == usersPage.number} ? 'active'">
        <a class="page-link" th:href="@{/admin/users(q=${q}, page=${i})}" th:text="${i + 1}">1</a>
      </li>

      <!-- Next button -->
      <li class="page-item" th:classappend="${usersPage.last} ? 'disabled'">
        <a class="page-link" th:href="@{/admin/users(q=${q}, page=${usersPage.number + 1})}" th:if="${!usersPage.last}">Next</a>
        <span class="page-link" th:if="${usersPage.last}">Next</span>
      </li>
    </ul>
  </nav>

  <!-- Page info -->
  <div class="text-center text-muted mb-3" th:if="${usersPage.totalElements > 0}">
    Showing <span th:text="${usersPage.number * usersPage.size + 1}">1</span> -
    <span th:text="${usersPage.number * usersPage.size + usersPage.numberOfElements}">50</span>
    of <span th:text="${usersPage.totalElements}">100</span> users
  </div>
</main>

</body>
</html>
