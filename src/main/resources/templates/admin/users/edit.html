<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container mt-4" style="max-width:800px;">
  <h1>Edit User</h1>

  <form th:action="@{/admin/users/edit}" th:object="${editUserForm}" method="post">
    <input type="hidden" th:field="*{employeeId}" />
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <!-- global errors -->
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
      <ul>
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>
    </div>

    <div class="mb-3">
      <label class="form-label">Employee Name</label>
      <input class="form-control" th:field="*{employeeName}" maxlength="150" />
      <div class="text-danger" th:if="${#fields.hasErrors('employeeName')}" th:errors="*{employeeName}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Hourly Rate</label>
      <input type="number" step="0.01" min="0.01" max="99999999.99" class="form-control" th:field="*{hourlyRate}" />
      <div class="text-danger" th:if="${#fields.hasErrors('hourlyRate')}" th:errors="*{hourlyRate}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea class="form-control" rows="2" th:field="*{address}" maxlength="255"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">New Password (leave blank to keep)</label>
      <input class="form-control" type="password" th:field="*{password}" />
      <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input class="form-control" type="password" th:field="*{confirmPassword}" />
      <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
    </div>

    <div class="mb-3 form-check">
      <input class="form-check-input" type="checkbox" th:field="*{active}" />
      <label class="form-check-label">Active</label>
    </div>

    <div class="d-flex justify-content-between">
      <a class="btn btn-secondary" th:href="@{/admin/users}">Cancel</a>
      <div>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </div>
  </form>

</main>

</body>
</html>
