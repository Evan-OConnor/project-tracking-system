<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Employee & User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 800px;">
  <h1>Create Employee & User</h1>

  <!-- flash success message -->
  <div th:if="${createdUsername}" class="alert alert-primary py-2">Created user: <strong th:text="${createdUsername}"></strong></div>

  <form th:action="@{/admin/users}" th:object="${createUserForm}" method="post" class="mt-3">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <!-- global errors -->
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
      <ul>
        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
      </ul>
    </div>

    <div class="mb-3">
      <label for="employeeName" class="form-label">Employee Name <span class="text-danger">*</span></label>
      <input id="employeeName" class="form-control" th:field="*{employeeName}" placeholder="Enter employee name" />
      <div class="text-danger" th:if="${#fields.hasErrors('employeeName')}" th:errors="*{employeeName}"></div>
    </div>

    <div class="mb-3">
      <label for="hourlyRate" class="form-label">Hourly Rate <span class="text-danger">*</span></label>
      <input id="hourlyRate" class="form-control" th:field="*{hourlyRate}" type="number" step="0.01" placeholder="0.00" />
      <div class="text-danger" th:if="${#fields.hasErrors('hourlyRate')}" th:errors="*{hourlyRate}"></div>
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea id="address" class="form-control" th:field="*{address}" rows="2" placeholder="Optional address"></textarea>
      <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
      <input id="password" class="form-control" th:field="*{password}" type="password" placeholder="Enter password" />
      <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"></div>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
      <input id="confirmPassword" class="form-control" th:field="*{confirmPassword}" type="password" placeholder="Confirm password" />
      <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <div>
        <button type="submit" class="btn btn-primary">Create</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
      </div>
    </div>

  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
