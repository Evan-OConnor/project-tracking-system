<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timesheet Entry Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">

    <div class="d-flex justify-content-between align-items-start">

        <div>
            <h1 class="mb-1" th:text="${entry.projectTitle}">Project Title</h1>
            <p class="text-muted mb-0">
                Timesheet Entry ID: <span th:text="${entry.id}">1</span>
            </p>
        </div>

        <div class="d-flex gap-2">

            <!-- Edit (ONLY if NOT billed) -->
            <a class="btn btn-outline-primary"
               th:if="${!entry.billed}"
               th:href="@{/timesheet-entries/{id}/edit(id=${entry.id})}">
                Edit
            </a>

            <!-- Back (ALWAYS visible) -->
            <a class="btn btn-outline-secondary"
               th:href="@{/timesheet-entries}">
                Back
            </a>

            <!-- Delete (ONLY if NOT billed) -->
            <button th:if="${!entry.billed}"
                    id="deleteBtn"
                    class="btn btn-outline-danger"
                    type="button"
                    th:attr="data-id=${entry.id}">
                Delete
            </button>

        </div>

    </div>

    <div class="card mt-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Employee</dt>
                <dd class="col-sm-9" th:text="${entry.employeeName}">Employee Name</dd>

                <dt class="col-sm-3">Work Description</dt>
                <dd class="col-sm-9" th:text="${entry.workDescription}">Description of work</dd>

                <dt class="col-sm-3">Date</dt>
                <dd class="col-sm-9"
                    th:text="${#temporals.format(entry.entryDate, 'yyyy-MM-dd')}">
                    2026-02-17
                </dd>

                <dt class="col-sm-3">Hours</dt>
                <dd class="col-sm-9" th:text="${entry.hours}">0.00</dd>
            </dl>
        </div>
    </div>

</main>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="appToast" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
