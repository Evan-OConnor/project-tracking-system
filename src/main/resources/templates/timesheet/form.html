<form th:action="@{/timesheet-entries}" th:object="${form}" method="post">

    <!-- Project -->
    <div class="mb-3">
        <label class="form-label">Project</label>
        <select class="form-select" th:field="*{projectId}" required>
            <option value="">Select project</option>
            <option th:each="p : ${projects}"
                    th:value="${p.id}"
                    th:text="${p.title}">
            </option>
        </select>
    </div>

    <!-- Employee -->
    <div class="mb-3">
        <label class="form-label">Employee</label>
        <select class="form-select" th:field="*{employeeId}" required>
            <option value="">Select employee</option>
            <option th:each="e : ${employees}"
                    th:value="${e.id}"
                    th:text="${e.name}">
            </option>
        </select>
    </div>

    <!-- Work Description -->
    <div class="mb-3">
        <label class="form-label">Work Description</label>
        <select class="form-select" th:field="*{workDescriptionId}" required>
            <option value="">Select description</option>
            <option th:each="d : ${descriptions}"
                    th:value="${d.id}"
                    th:text="${d.name}">
            </option>
        </select>
    </div>

    <!-- Date -->
    <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" class="form-control"
               th:field="*{entryDate}" required>
    </div>

    <!-- Hours -->
    <div class="mb-3">
        <label class="form-label">Hours</label>
        <input type="number" step="0.25"
               class="form-control"
               th:field="*{hours}" required>
    </div>

    <button class="btn btn-primary">Save</button>

</form>
