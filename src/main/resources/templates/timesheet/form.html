<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${isEdit} ? 'Edit Timesheet Entry' : 'Create Timesheet Entry'">
        Timesheet Entry
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width:600px;">

    <h1 class="mb-4"
        th:text="${isEdit} ? 'Edit Timesheet Entry' : 'Create Timesheet Entry'">
        Timesheet Entry
    </h1>

    <form th:object="${form}"
          th:action="${isEdit} ? @{/timesheet-entries/{id}(id=${form.id})} : @{/timesheet-entries}"
          method="post"
          class="needs-validation"
          novalidate>

        <!-- Hidden ID for edit -->
        <input type="hidden" th:field="*{id}">

        <!-- Project -->
        <div class="mb-3">
            <label class="form-label">Project</label>

            <select class="form-select"
                    th:field="*{projectId}"
                    th:classappend="${#fields.hasErrors('projectId')} ? 'is-invalid'"
                    required>

                <option value="" disabled>Select a project</option>

                <option th:each="p : ${projects}"
                        th:value="${p.id}"
                        th:text="${p.title}">
                </option>

            </select>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('projectId')}"
                 th:errors="*{projectId}">
            </div>
        </div>

        <!-- Employee -->
        <div class="mb-3">
            <label class="form-label">Employee</label>

            <select class="form-select"
                    th:field="*{employeeId}"
                    th:classappend="${#fields.hasErrors('employeeId')} ? 'is-invalid'"
                    required>

                <option value="" disabled>Select an employee</option>

                <option th:each="e : ${employees}"
                        th:value="${e.id}"
                        th:text="${e.name}">
                </option>

            </select>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('employeeId')}"
                 th:errors="*{employeeId}">
            </div>
        </div>

        <!-- Work Description -->
        <div class="mb-3">
            <label class="form-label">Work Description</label>

            <select id="workDescriptionSelect"
                    class="form-select"
                    th:field="*{workDescriptionId}"
                    th:classappend="${#fields.hasErrors('workDescriptionId')} ? 'is-invalid'"
                    required>

                <option value="" disabled>Select a work description</option>

                <option th:each="d : ${workDescriptions}"
                        th:value="${d.id}"
                        th:text="${d.name}">
                </option>

            </select>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('workDescriptionId')}"
                 th:errors="*{workDescriptionId}">
            </div>
        </div>

        <!-- OTHER DESCRIPTION FIELD -->
        <div class="mb-3" id="otherDescriptionContainer" style="display:none;">
            <label class="form-label">Other Description</label>

            <input type="text"
                   class="form-control"
                   th:field="*{otherDescription}"
                   placeholder="Enter custom work description">
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label class="form-label">Date</label>

            <input type="date"
                   class="form-control"
                   th:field="*{entryDate}"
                   th:classappend="${#fields.hasErrors('entryDate')} ? 'is-invalid'"
                   required>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('entryDate')}"
                 th:errors="*{entryDate}">
            </div>
        </div>

        <!-- Hours -->
        <div class="mb-3">
            <label class="form-label">Hours</label>

            <input type="number"
                   step="0.25"
                   class="form-control"
                   th:field="*{hours}"
                   th:classappend="${#fields.hasErrors('hours')} ? 'is-invalid'"
                   required>

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('hours')}"
                 th:errors="*{hours}">
            </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-between">

            <a class="btn btn-outline-secondary"
               th:href="@{/timesheet-entries}">
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Save
            </button>

        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
