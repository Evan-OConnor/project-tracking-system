<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Timesheet Entries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Timesheet Entries</h1>
        <a class="btn btn-primary" th:href="@{/timesheet-entries/new}">+ New Entry</a>
    </div>

    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="mb-3">
        <input id="searchInput" type="text" class="form-control" placeholder="Search by project or employee">
    </div>

    <div class="table-responsive">

        <table id="entriesTable" class="table table-striped align-middle">

            <thead>
            <tr>
                <th>Project</th>
                <th>Employee</th>
                <th>Description</th>
                <th>Date</th>
                <th>Hours</th>
                <th>Charge</th>
                <th>Billing Status</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="entry : ${entries}">
                <td th:text="${entry.projectTitle}">Project Title</td>
                <td th:text="${entry.employeeName}">Employee Name</td>
                <td th:text="${entry.workDescription}">Work Description</td>
                <td th:text="${#temporals.format(entry.entryDate,'yyyy-MM-dd')}">Date</td>
                <td th:text="${entry.hours}">Hours</td>
                <td th:text="${entry.charge}">Charge</td>
                <td><span th:if="${entry.billed}" class="badge bg-success">Billed</span><span th:if="${!entry.billed}" class="badge bg-warning text-dark">Unbilled</span></td>

                <td class="text-end">

                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/timesheet-entries/{id}(id=${entry.id})}">
                        View
                    </a>

                    <!-- Edit ONLY if NOT billed -->
                    <a class="btn btn-sm btn-outline-primary"
                       th:if="${!entry.billed}"
                       th:href="@{/timesheet-entries/{id}/edit(id=${entry.id})}">
                        Edit
                    </a>

                    <!-- Delete ONLY if NOT billed -->
                    <form th:if="${!entry.billed}"
                          th:action="@{/timesheet-entries/{id}/delete(id=${entry.id})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Delete this timesheet entry?');">

                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <!-- Empty state -->
            <tr th:if="${#lists.isEmpty(entries)}">
                <td colspan="8" class="text-center text-muted">
                    No timesheet entries yet.
                </td>
            </tr>

            </tbody>

            <!-- Totals row -->
            <tfoot th:if="${!#lists.isEmpty(entries)}">
            <tr class="fw-bold table-light">
                <td colspan="4" class="text-end">Totals:</td>
                <td th:text="${#aggregates.sum(entries.![hours])}">0</td>
                <td th:text="${#aggregates.sum(entries.![charge])}">0</td>
                <td></td>
            </tr>
            </tfoot>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/timesheet-entries/list.js}"></script>

</body>
</html>
