<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timesheet Entries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .timesheet-main {
            padding: 40px 0;
        }

        .timesheet-header {
            margin-bottom: 1.5rem;
        }

        .projects-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.35rem;
        }

        .projects-subtitle {
            color: #64748b;
            margin-bottom: 0;
            font-size: 1rem;
        }

        .btn-new-project {
            background: #2563eb;
            color: #fff;
            border: 1px solid #2563eb;
            border-radius: 12px;
            padding: 0.55rem 0.95rem;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
        }

        .btn-new-project:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #fff;
        }

        .timesheet-search-wrap {
            max-width: 640px;
            margin-bottom: 1rem;
        }

        .timesheet-search-wrap .input-group-text {
            padding: 6px 10px;
        }

        .projects-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .projects-table {
            margin-bottom: 0;
        }

        .projects-table th {
            font-size: 0.76rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            border-bottom-color: #e5e7eb;
        }

        .projects-table th,
        .projects-table td {
            padding-top: 0.8rem;
            padding-bottom: 0.8rem;
            padding-left: 0.9rem;
            padding-right: 0.9rem;
            vertical-align: middle;
        }

        .projects-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .projects-table tbody tr:hover {
            background: #f8fafc;
        }

        .project-title-cell {
            max-width: 260px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-project {
            min-width: 220px;
        }

        .col-description {
            min-width: 220px;
        }

        .col-date,
        .col-hours,
        .col-charge,
        .col-actions {
            white-space: nowrap;
        }

        .col-date {
            width: 112px;
        }

        .col-hours {
            width: 76px;
        }

        .col-charge {
            width: 80px;
        }

        .col-status {
            min-width: 136px;
            white-space: nowrap;
        }

        .col-actions {
            min-width: 128px;
        }

        .projects-table th.col-date,
        .projects-table td.col-date,
        .projects-table th.col-hours,
        .projects-table td.col-hours,
        .projects-table th.col-charge,
        .projects-table td.col-charge {
            padding-left: 0.65rem;
            padding-right: 0.65rem;
        }

        .recent-projects-name {
            font-size: 0.9rem;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.18rem 0.6rem;
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .badge-active {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-completed {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-cancelled {
            background: #ffe4d6;
            color: #c2410c;
        }

        .actions-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            flex-wrap: nowrap;
            width: 7rem;
            margin-left: auto;
        }

        .action-placeholder {
            width: 2rem;
            height: 2rem;
            flex: 0 0 2rem;
            border-radius: 10px;
            visibility: hidden;
            pointer-events: none;
        }

        .recent-view-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .recent-view-link svg {
            width: 16px;
            height: 16px;
        }

        .recent-view-link:hover {
            color: #475569;
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .action-icon-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #2563eb;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .action-icon-link svg {
            width: 16px;
            height: 16px;
        }

        .action-icon-link:hover {
            color: #1d4ed8;
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .delete-action-link {
            border-color: #fca5a5;
            background: #fff1f2;
            color: #b91c1c;
        }

        .delete-action-link:hover {
            color: #991b1b;
            background: #ffe4e6;
            border-color: #f87171;
        }

        @media (max-width: 767.98px) {
            .actions-wrap {
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .project-title-cell {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container timesheet-main">

    <section class="d-flex justify-content-between align-items-center flex-wrap timesheet-header">
        <div>
            <h1 class="projects-title">Timesheet Entries</h1>
            <p class="projects-subtitle">Manage and view timesheet entries.</p>
        </div>
        <a class="btn btn-new-project" th:href="@{/timesheet-entries/new}">+ New Entry</a>
    </section>

    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="timesheet-search-wrap">
        <div class="input-group">
            <span class="input-group-text" id="search-addon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <input id="searchInput" type="text" class="form-control" placeholder="Search by project or employee...">
        </div>
    </div>

    <div class="projects-card">
        <div class="table-responsive">
            <table id="entriesTable" class="table table-striped align-middle projects-table">

                <thead>
                <tr>
                    <th class="col-project">Project</th>
                    <th>Employee</th>
                    <th class="col-description">Description</th>
                    <th class="col-date">Date</th>
                    <th class="col-hours text-end">Hours</th>
                    <th class="col-charge text-end">Charge</th>
                    <th class="col-status">Billing Status</th>
                    <th class="col-actions text-end">Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="entry : ${entries}">
                    <td class="project-title-cell col-project recent-projects-name" th:text="${entry.projectTitle}" th:title="${entry.projectTitle}">Project Title</td>
                    <td class="recent-projects-name" th:text="${entry.employeeName}">Employee Name</td>
                    <td class="col-description recent-projects-name" th:text="${entry.workDescription}">Work Description</td>
                    <td class="col-date recent-projects-name" th:text="${#temporals.format(entry.entryDate,'yyyy-MM-dd')}">Date</td>
                    <td class="col-hours recent-projects-name text-end" th:text="${entry.hours}">Hours</td>
                    <td class="col-charge recent-projects-name text-end" th:text="${entry.charge}">Charge</td>
                    <td class="col-status">
                        <span class="status-pill"
                              th:classappend="${entry.billed} ? ' badge-completed' : ' badge-active'"
                              th:text="${entry.billed} ? 'BILLED' : 'UNBILLED'">
                            BILLED
                        </span>
                    </td>

                    <td class="col-actions text-end">
                        <div class="actions-wrap">
                            <a class="recent-view-link"
                               th:href="@{/timesheet-entries/{id}(id=${entry.id})}"
                               aria-label="View timesheet entry">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </a>

                            <a class="action-icon-link"
                               th:if="${!entry.billed}"
                               th:href="@{/timesheet-entries/{id}/edit(id=${entry.id})}"
                               aria-label="Edit timesheet entry">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                            </a>
                            <span class="action-placeholder" th:if="${entry.billed}" aria-hidden="true"></span>

                            <form th:if="${!entry.billed}"
                                  th:action="@{/timesheet-entries/{id}/delete(id=${entry.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Delete this timesheet entry?');">

                                <button type="submit" class="action-icon-link delete-action-link" aria-label="Delete timesheet entry">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2" aria-hidden="true" focusable="false"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </form>
                            <span class="action-placeholder" th:if="${entry.billed}" aria-hidden="true"></span>
                        </div>
                    </td>
                </tr>

                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(entries)}">
                    <td colspan="8" class="text-center text-muted">No timesheet entries yet.</td>
                </tr>

                </tbody>


            </table>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/timesheet-entries/list.js}"></script>

</body>
</html>
