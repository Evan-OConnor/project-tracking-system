<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Timesheet Entries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Timesheet Entries</h1>
        <a class="btn btn-primary" th:href="@{/timesheet-entries/new}">+ New Entry</a>
    </div>

    <div class="mb-3">
        <input id="searchInput" type="text" class="form-control" placeholder="Search by project or employee">
    </div>

    <div class="table-responsive">
        <table id="entriesTable" class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Project</th>
                <th>Employee</th>
                <th>Description</th>
                <th>Date</th>
                <th>Hours</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${entries}">
                <td th:text="${entry.projectTitle}">Project Title</td>
                <td th:text="${entry.employeeName}">Employee Name</td>
                <td th:text="${entry.workDescription}">Work Description</td>
                <td th:text="${entry.entryDate.format(T(java.time.format.DateTimeFormatter).ofPattern('yyyy-MM-dd'))}">Date</td>
                <td th:text="${entry.hours}">Hours</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/timesheet-entries/{id}(id=${entry.id})}">View</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/timesheet-entries/{id}/edit(id=${entry.id})}">Edit</a>
                    <button type="button" class="btn btn-sm btn-outline-danger delete-btn" data-id="${entry.id}">
                        Delete
                    </button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(entries)}">
                <td colspan="6" class="text-center text-muted">No timesheet entries yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="appToast" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/timesheet-entries/list.js}"></script>

</body>
</html>
