<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container dashboard">

    <!-- Active Projects -->
    <div class="card-clean mb-4 text-center">
        <h5 class="text-muted">Active Projects</h5>
        <div class="stat-number" th:text="${activeProjectCount}">0</div>

        <a th:href="@{/projects}" class="btn btn-primary mt-3">
            View Projects
        </a>
    </div>

    <!-- Module Buttons -->
    <div class="card-clean">
        <h5 class="mb-4 text-center">Quick Access</h5>

        <div class="row g-3">

            <div class="col-md-4">
                <a th:href="@{/projects}" class="btn btn-light w-100 module-btn">
                    📁 Projects
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/contacts}" class="btn btn-light w-100 module-btn">
                    👥 Contacts
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/timesheet-entries}" class="btn btn-light w-100 module-btn">
                    ⏱ Timesheets
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/cost-items}" class="btn btn-light w-100 module-btn">
                    💸 Expenses
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/invoices}" class="btn btn-light w-100 module-btn">
                    🧾 Invoices
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/reports}" class="btn btn-light w-100 module-btn">
                    📊 Reports
                </a>
            </div>

        </div>
    </div>

</main>

</body>
</html>
