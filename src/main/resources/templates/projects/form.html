<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}">Project Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">
  <h1 th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}">Project Form</h1>
  <p class="text-muted">Create or edit a project. Required fields are marked.</p>

  <form th:action="${mode == 'edit'} ? @{/projects/{id}(id=${projectId})} : @{/projects}"
        th:object="${projectForm}"
        method="post"
        class="mt-3">

    <!-- CATEGORY -->
    <div class="mb-3">
      <label class="form-label">Category <span class="text-danger">*</span></label>
      <select class="form-select" th:field="*{categoryId}" required>
        <option value="">Select category...</option>
        <option th:each="c : ${categories}"
                th:value="${c.id}"
                th:text="${c.name}">
        </option>
      </select>
    </div>

    <!-- STATUS -->
    <div class="mb-3">
      <label class="form-label">Status <span class="text-danger">*</span></label>
      <select class="form-select" th:field="*{statusId}" required>
        <option value="">Select status...</option>
        <option th:each="s : ${statuses}"
                th:value="${s.id}"
                th:text="${s.name}">
        </option>
      </select>
    </div>

    <!-- CLIENT CONTACT (REQUIRED) -->
    <div class="mb-3">
      <label class="form-label">Client <span class="text-danger">*</span></label>
      <select class="form-select" th:field="*{clientContactId}" required>
        <option value="">Select client...</option>
        <option th:each="c : ${contacts}"
                th:value="${c.id}"
                th:text="${c.name}">
        </option>
      </select>
      <div class="form-text">Client is required for every project.</div>
    </div>

    <!-- OPTIONAL CONTACTS -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Solicitor (optional)</label>
        <select class="form-select" th:field="*{solicitorContactId}">
          <option value="">None</option>
          <option th:each="c : ${contacts}"
                  th:value="${c.id}"
                  th:text="${c.name}">
          </option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Insurance Company (optional)</label>
        <select class="form-select" th:field="*{insuranceCompanyContactId}">
          <option value="">None</option>
          <option th:each="c : ${contacts}"
                  th:value="${c.id}"
                  th:text="${c.name}">
          </option>
        </select>
      </div>
    </div>

    <!-- TITLE -->
    <div class="mb-3">
      <label class="form-label">Title <span class="text-danger">*</span></label>
      <input class="form-control" th:field="*{title}" placeholder="Project title" required>
    </div>

    <!-- DESCRIPTION -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Short description"></textarea>
    </div>

    <!-- START DATE -->
    <div class="mb-3">
      <label class="form-label">Start Date <span class="text-danger">*</span></label>
      <input type="date" class="form-control" th:field="*{startDate}" required>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/projects}">Cancel</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
