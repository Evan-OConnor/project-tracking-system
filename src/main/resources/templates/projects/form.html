<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}">Project Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">
  <h1 th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}">Project Form</h1>
  <p class="text-muted">This is a placeholder CRUD form for Task 3.2 (wired to DB later).</p>

  <form th:action="${mode == 'edit'} ? @{/projects/{id}(id=${projectId})} : @{/projects}"
        th:object="${projectForm}"
        method="post"
        class="mt-3">

    <div class="mb-3">
      <label class="form-label">Reference</label>
      <input class="form-control" th:field="*{reference}" placeholder="PRJ-2026-001" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" th:field="*{title}" placeholder="Project title" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Short description"></textarea>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" th:field="*{status}">
          <option value="OPEN">OPEN</option>
          <option value="IN_PROGRESS">IN_PROGRESS</option>
          <option value="CLOSED">CLOSED</option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" class="form-control" th:field="*{startDate}">
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">End Date</label>
        <input type="date" class="form-control" th:field="*{endDate}">
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/projects}">Cancel</a>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
