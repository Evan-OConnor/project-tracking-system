<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}">Project Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">

  <h1 th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}"></h1>
  <p class="text-muted">Create or edit a project. Required fields are marked.</p>

  <form th:object="${projectForm}"
        th:action="${mode == 'edit'} ? @{'/projects/' + ${projectId}} : @{/projects}"
        method="post"
        class="mt-3">

    <!-- CSRF -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <!-- Global validation message -->
    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
      Please correct the errors below.
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label class="form-label">
        Category <span class="text-danger">*</span>
      </label>

      <select class="form-select"
              th:field="*{categoryId}"
              required
              th:classappend="${#fields.hasErrors('categoryId')} ? ' is-invalid'">

        <option value="">Select category...</option>

        <option th:each="c : ${categories}"
                th:value="${c.id}"
                th:text="${c.name}">
        </option>

      </select>

      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('categoryId')}"
           th:errors="*{categoryId}">
      </div>
    </div>

    <!-- Status -->
    <div class="mb-3">
      <label class="form-label">
        Status <span class="text-danger">*</span>
      </label>

      <select class="form-select"
              th:field="*{statusId}"
              required
              th:classappend="${#fields.hasErrors('statusId')} ? ' is-invalid'">

        <option value="">Select status...</option>

        <option th:each="s : ${statuses}"
                th:value="${s.id}"
                th:text="${s.name}"
                th:selected="${mode == 'new' and s.name == 'IN_PROGRESS'}">
        </option>

      </select>

      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('statusId')}"
           th:errors="*{statusId}">
      </div>
    </div>

    <!-- Client -->
    <div class="mb-3">
      <label class="form-label">
        Client <span class="text-danger">*</span>
      </label>

      <input class="form-control"
             list="clients-list"
             th:field="*{clientContactName}"
             placeholder="Start typing client name..."
             required
             th:classappend="${#fields.hasErrors('clientContactName')} ? ' is-invalid'">

      <datalist id="clients-list">
        <option th:each="c : ${contacts}" th:value="${c.name}"></option>
      </datalist>

      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('clientContactName')}"
           th:errors="*{clientContactName}">
      </div>
    </div>

    <!-- Solicitor + Insurance -->
    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Solicitor (optional)</label>

        <input class="form-control"
               list="solicitors-list"
               th:field="*{solicitorContactName}"
               placeholder="Solicitor name">

        <datalist id="solicitors-list">
          <option th:each="c : ${contacts}" th:value="${c.name}"></option>
        </datalist>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Insurance Company (optional)</label>

        <input class="form-control"
               list="insurance-list"
               th:field="*{insuranceCompanyContactName}"
               placeholder="Insurance company">

        <datalist id="insurance-list">
          <option th:each="c : ${contacts}" th:value="${c.name}"></option>
        </datalist>
      </div>

    </div>

    <!-- Title -->
    <div class="mb-3">
      <label class="form-label">
        Title <span class="text-danger">*</span>
      </label>

      <input class="form-control"
             th:field="*{title}"
             placeholder="Project title"
             required
             th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'">

      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">
      </div>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>

      <textarea class="form-control"
                th:field="*{description}"
                rows="4"
                placeholder="Short description"
                th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"></textarea>

      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('description')}"
           th:errors="*{description}">
      </div>
    </div>

    <!-- Start Date -->
    <div class="mb-3">
      <label class="form-label">
        Start Date <span class="text-danger">*</span>
      </label>

      <input type="date"
             class="form-control"
             th:field="*{startDate}"
             required
             th:classappend="${#fields.hasErrors('startDate')} ? ' is-invalid'">

      <div class="invalid-feedback"
           th:if="${#fields.hasErrors('startDate')}"
           th:errors="*{startDate}">
      </div>
    </div>

    <!-- Buttons -->
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        Save Project
      </button>

      <a class="btn btn-outline-secondary"
         th:href="@{/projects}">
        Cancel
      </a>
    </div>

  </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
