<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}">Project Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">
  <h1 th:text="${mode == 'edit' ? 'Edit Project' : 'New Project'}">Project Form</h1>
  <p class="text-muted">Create or edit a project. Required fields are marked.</p>

  <form th:object="${projectForm}"
        th:action="${mode == 'edit'} ? @{'/projects/' + ${projectId}} : @{'/projects'}"
        method="post"
        class="mt-3 needs-validation"
        novalidate>

    <!-- CSRF Token -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <!-- CATEGORY -->
    <div class="mb-3">
      <label class="form-label">Category <span class="text-danger">*</span></label>
      <select class="form-select" th:field="*{categoryId}" required>
        <option value="">Select category...</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>
    </div>

    <!-- STATUS -->
    <div class="mb-3">
      <label class="form-label">Status <span class="text-danger">*</span></label>
      <select class="form-select" th:field="*{statusId}" required>
        <option value="">Select status...</option>
        <option th:each="s : ${statuses}"
                th:value="${s.id}"
                th:text="${s.name}"
                th:selected="${s.id == projectForm.statusId or (projectForm.statusId == null and s.name == 'IN_PROGRESS')}">
        </option>
      </select>
    </div>

    <!-- CLIENT CONTACT -->
    <div class="mb-3">
      <label class="form-label">
        Client <span class="text-danger">*</span>
      </label>

      <input class="form-control"
             list="clients-list"
             th:field="*{clientContactName}"
             required>

      <datalist id="clients-list">
        <option th:each="c : ${contacts}"
                th:value="${c.name}">
        </option>
      </datalist>

      <div class="form-text">
        Client is required for every project.
      </div>
    </div>

    <!-- OPTIONAL CONTACTS -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Solicitor (optional)</label>
        <input class="form-control" list="solicitors-list" th:field="*{solicitorContactId}">
        <datalist id="solicitors-list">
          <option th:each="c : ${contacts}" th:value="${c.id}" th:text="${c.name}"></option>
        </datalist>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Insurance Company (optional)</label>
        <input class="form-control" list="insurance-list" th:field="*{insuranceCompanyContactId}">
        <datalist id="insurance-list">
          <option th:each="c : ${contacts}" th:value="${c.id}" th:text="${c.name}"></option>
        </datalist>
      </div>
    </div>

    <!-- TITLE -->
    <div class="mb-3">
      <label class="form-label">Title <span class="text-danger">*</span></label>
      <input class="form-control" th:field="*{title}" placeholder="Project title" required>
    </div>

    <!-- DESCRIPTION -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Short description"></textarea>
    </div>

    <!-- START DATE -->
    <div class="mb-3">
      <label class="form-label">Start Date <span class="text-danger">*</span></label>
      <input type="date" class="form-control" th:field="*{startDate}" required>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn btn-outline-secondary" th:href="@{/projects}">Cancel</a>
    </div>

  </form>
</main>

<!-- Toast Container (optional, for feedback) -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="appToast" class="toast align-items-center text-white bg-success border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- External JS -->
<script th:src="@{/js/projects/list.js}"></script>

</body>
</html>
