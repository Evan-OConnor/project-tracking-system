<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Projects</h1>
        <a class="btn btn-primary" th:href="@{/projects/new}">+ New Project</a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show mb-3">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Advanced Search -->
    <div class="card mb-4">
        <div class="card-body">

            <form th:action="@{/projects/search}"
                  method="get"
                  th:object="${criteria}"
                  class="row g-3">

                <div class="col-md-3">
                    <input type="text"
                           th:field="*{title}"
                           class="form-control"
                           maxlength="80"
                           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                           placeholder="Project title">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}">
                    </div>
                </div>

                <div class="col-md-2">
                    <select th:field="*{status}" class="form-select">
                        <option value="">Any Status</option>
                        <option th:each="status : ${statuses}"
                                th:value="${status.name}"
                                th:text="${status.name}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <input class="form-control"
                           th:field="*{clientContactName}"
                           placeholder="Search client...">
                </div>

                <div class="col-md-2">
                    <input type="date"
                           th:field="*{startDateFrom}"
                           class="form-control">
                </div>

                <div class="col-md-2">
                    <input type="date"
                           th:field="*{startDateTo}"
                           class="form-control">
                </div>

                <div class="col-md-2">
                    <select th:field="*{hasInvoices}" class="form-select">
                        <option value="">Invoices: Any</option>
                        <option value="true">With invoices</option>
                        <option value="false">No invoices</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select th:field="*{hasExpenses}" class="form-select">
                        <option value="">Expenses: Any</option>
                        <option value="true">With expenses</option>
                        <option value="false">No expenses</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Search
                    </button>

                    <a th:href="@{/projects}" class="btn btn-outline-secondary w-100">
                        Clear
                    </a>
                </div>

            </form>

        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table id="projectsTable" class="table table-striped align-middle">

            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Category</th>
                <th>Client</th>
                <th>Start Date</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${projects}">

                <td th:text="${p.id}">1</td>

                <td th:text="${p.title}">Example</td>

                <!-- Status -->
                <td>
                    <span class="badge"
                          th:classappend="${p.status != null && p.status.equalsIgnoreCase('OPEN')} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${p.status}">
                    </span>
                </td>

                <!-- ✅ FIXED: DTO fields -->
                <td th:text="${p.categoryName}"></td>

                <td th:text="${p.clientName}"></td>

                <td th:text="${p.startDate != null ? #temporals.format(p.startDate,'yyyy-MM-dd') : '—'}"></td>

                <!-- Actions -->
                <td class="text-end">

                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/projects/{id}(id=${p.id})}">
                        View
                    </a>

                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/projects/{id}/edit(id=${p.id})}">
                        Edit
                    </a>

                    <form th:action="@{/projects/{id}/delete(id=${p.id})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Delete this project?')">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <button type="submit"
                                class="btn btn-sm btn-outline-danger">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="7" class="text-center text-muted">
                    No projects found.
                </td>
            </tr>

            </tbody>

        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
