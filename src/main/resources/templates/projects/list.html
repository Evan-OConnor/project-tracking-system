<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Projects</h1>
        <a class="btn btn-primary" th:href="@{/projects/new}">+ New Project</a>
    </div>

    <!-- Search box -->
    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="Search projects by title...">
    </div>

    <div class="table-responsive">
        <table id="projectsTable" class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Category</th>
                <th>Client</th>
                <th>Start Date</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${projects}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.title}">Example Project</td>
                <td>
                    <span class="badge text-bg-secondary" th:text="${p.status}">Open</span>
                </td>
                <td th:text="${p.category}">Category</td>
                <td th:text="${p.clientContact?.name}">Client Name</td>
                <td th:text="${p.startDate}">2026-02-04</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/projects/{id}(id=${p.id})}">View</a>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/projects/{id}/edit(id=${p.id})}">Edit</a>
                    <button type="button"
                            class="btn btn-sm btn-outline-danger delete-btn"
                            th:data-id="${p.id}">
                        Delete
                    </button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="7" class="text-center text-muted">No projects yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="appToast" class="toast align-items-center text-white bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/projects/list.js}"></script>

</body>
</html>
