<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Projects</h1>
        <a class="btn btn-primary" th:href="@{/projects/new}">+ New Project</a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show mb-3"
         role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show mb-3"
         role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Advanced Search -->
    <div class="card mb-4">
        <div class="card-body">

            <form th:action="@{/projects/search}"
                  method="get"
                  th:object="${criteria}"
                  class="row g-3">

                <!-- Title -->
                <div class="col-md-3">
                    <input type="text"
                           th:field="*{title}"
                           class="form-control"
                           placeholder="Project title">
                </div>

                <!-- Status -->
                <div class="col-md-2">
                    <select th:field="*{statusId}" class="form-select">
                        <option value="">Any Status</option>
                        <option th:each="status : ${statuses}"
                                th:value="${status.id}"
                                th:text="${status.name}">
                        </option>
                    </select>
                </div>

                <!-- Client -->
                <div class="col-md-3">
                    <select th:field="*{clientId}" class="form-select">
                        <option value="">Any Client</option>
                        <option th:each="c : ${contacts}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </select>
                </div>

                <!-- Date range -->
                <div class="col-md-2">
                    <input type="date"
                           th:field="*{startDateFrom}"
                           class="form-control"
                           title="Start date from">
                </div>

                <div class="col-md-2">
                    <input type="date"
                           th:field="*{startDateTo}"
                           class="form-control"
                           title="Start date to">
                </div>

                <!-- Has invoices -->
                <div class="col-md-2">
                    <select th:field="*{hasInvoices}" class="form-select">
                        <option value="">Invoices: Any</option>
                        <option value="true">With invoices</option>
                        <option value="false">No invoices</option>
                    </select>
                </div>

                <!-- Has expenses -->
                <div class="col-md-2">
                    <select th:field="*{hasExpenses}" class="form-select">
                        <option value="">Expenses: Any</option>
                        <option value="true">With expenses</option>
                        <option value="false">No expenses</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Search
                    </button>

                    <a th:href="@{/projects}" class="btn btn-outline-secondary w-100">
                        Clear
                    </a>
                </div>

            </form>

        </div>
    </div>

    <!-- Quick Search -->
    <div class="mb-3">
        <input type="text"
               id="searchInput"
               class="form-control"
               placeholder="Quick filter projects by title...">
    </div>

    <div class="table-responsive">
        <table id="projectsTable" class="table table-striped align-middle">

            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Category</th>
                <th>Client</th>
                <th>Start Date</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${projects}">
                <td th:text="${p.id}">1</td>

                <td th:text="${p.title}">Example Project</td>

                <td>
                    <span class="badge"
                          th:classappend="${p.status?.name == 'Open'} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${p.status?.name}">
                    </span>
                </td>

                <td th:text="${p.category?.name}">Category</td>

                <td th:text="${p.clientContact?.name}">
                    Client Name
                </td>

                <td th:text="${#temporals.format(p.startDate,'yyyy-MM-dd')}">
                    2026-02-04
                </td>

                <td class="text-end">

                    <!-- VIEW (preserves filters) -->
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/projects/{id}(
                            id=${p.id},
                            title=${criteria.title},
                            statusId=${criteria.statusId},
                            clientId=${criteria.clientId},
                            startDateFrom=${criteria.startDateFrom},
                            startDateTo=${criteria.startDateTo},
                            hasInvoices=${criteria.hasInvoices},
                            hasExpenses=${criteria.hasExpenses}
                       )}">
                        View
                    </a>

                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/projects/{id}/edit(id=${p.id})}">
                        Edit
                    </a>

                    <form th:action="@{/projects/{id}/delete(id=${p.id})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Delete this project?')">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <button type="submit"
                                class="btn btn-sm btn-outline-danger">
                            Delete
                        </button>

                    </form>

                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="7" class="text-center text-muted">
                    No projects found.
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/projects/list.js}"></script>

<script>
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(alert => {
            let bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 4000);
</script>

</body>
</html>
