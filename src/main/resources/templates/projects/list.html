<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Projects</h1>
        <a class="btn btn-primary" th:href="@{/projects/new}">+ New Project</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Category</th>
                <th>Client</th>
                <th>Start Date</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${projects}">
                <td th:text="${p.id}">1</td>

                <td th:text="${p.title}">Example Project</td>

                <td>
                    <span class="badge text-bg-secondary"
                          th:text="${p.status.name}">
                        Open
                    </span>
                </td>

                <td th:text="${p.category.name}">Category</td>

                <td th:text="${p.clientContact.name}">Client Name</td>

                <td th:text="${p.startDate}">2026-02-04</td>

                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/projects/{id}(id=${p.id})}">View</a>

                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/projects/{id}/edit(id=${p.id})}">Edit</a>

                    <form th:action="@{/projects/{id}/delete(id=${p.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger" type="submit"
                                onclick="return confirm('Delete this project?');">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="7" class="text-center text-muted">No projects yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
