<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="mb-1" th:text="${project.title}">Project Title</h1>
            <p class="text-muted mb-0">
                Project ID: <span th:text="${project.id}">1</span>
            </p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/projects/{id}/edit(id=${project.id})}">Edit</a>
            <a class="btn btn-outline-secondary" th:href="@{/projects}">Back</a>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Status</dt>
                <dd class="col-sm-9" th:text="${project.status.name}">Open</dd>

                <dt class="col-sm-3">Category</dt>
                <dd class="col-sm-9" th:text="${project.category.name}">Category</dd>

                <dt class="col-sm-3">Client</dt>
                <dd class="col-sm-9" th:text="${project.clientContact.name}">Client Name</dd>

                <dt class="col-sm-3">Solicitor</dt>
                <dd class="col-sm-9"
                    th:text="${project.solicitorContact != null ? project.solicitorContact.name : 'None'}">
                    None
                </dd>

                <dt class="col-sm-3">Insurance Company</dt>
                <dd class="col-sm-9"
                    th:text="${project.insuranceCompanyContact != null ? project.insuranceCompanyContact.name : 'None'}">
                    None
                </dd>

                <dt class="col-sm-3">Start Date</dt>
                <dd class="col-sm-9" th:text="${project.startDate}">2026-02-04</dd>

                <dt class="col-sm-3">Description</dt>
                <dd class="col-sm-9" th:text="${project.description}">...</dd>
            </dl>

            <div class="mt-3">
                <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" class="d-inline">
                    <button class="btn btn-outline-danger" type="submit"
                            onclick="return confirm('Delete this project?');">
                        Delete Project
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
