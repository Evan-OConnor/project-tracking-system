<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="mb-1">Project Details</h1>
            <p class="text-muted mb-0">Placeholder details page for Task 3.2.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/projects/{id}/edit(id=${project.id})}">Edit</a>
            <a class="btn btn-outline-secondary" th:href="@{/projects}">Back</a>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${project.id}">1</dd>

                <dt class="col-sm-3">Reference</dt>
                <dd class="col-sm-9" th:text="${project.reference}">PRJ-001</dd>

                <dt class="col-sm-3">Title</dt>
                <dd class="col-sm-9" th:text="${project.title}">Example Project</dd>

                <dt class="col-sm-3">Status</dt>
                <dd class="col-sm-9" th:text="${project.status}">OPEN</dd>

                <dt class="col-sm-3">Start Date</dt>
                <dd class="col-sm-9" th:text="${project.startDate}">2026-02-04</dd>

                <dt class="col-sm-3">End Date</dt>
                <dd class="col-sm-9" th:text="${project.endDate}">-</dd>

                <dt class="col-sm-3">Description</dt>
                <dd class="col-sm-9" th:text="${project.description}">...</dd>
            </dl>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
