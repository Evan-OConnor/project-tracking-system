<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Tracking Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Project Tracking Dashboard</h1>

    <div class="row">
        <div class="col-md-4 mb-3">
            <a class="btn btn-primary w-100" th:href="@{/reports/projects/summary}">Project Summary</a>
        </div>
        <div class="col-md-4 mb-3">
            <a class="btn btn-primary w-100" th:href="@{/reports/invoices/outstanding}">Outstanding Invoices</a>
        </div>
        <div class="col-md-4 mb-3">
            <a class="btn btn-primary w-100" th:href="@{/reports/invoices/register}">Invoice Register</a>
        </div>
        <div class="col-md-4 mb-3">
            <a class="btn btn-primary w-100" th:href="@{/reports/costs}">Cost & Outlay Report</a>
        </div>
        <div class="col-md-4 mb-3">
            <a class="btn btn-primary w-100" th:href="@{/reports/timesheets}">Timesheet Report</a>
        </div>
        <div class="col-md-4 mb-3">
            <a class="btn btn-primary w-100" th:href="@{/reports/revenue/summary}">Revenue Summary</a>
        </div>
    </div>

</div>
</body>
</html>
