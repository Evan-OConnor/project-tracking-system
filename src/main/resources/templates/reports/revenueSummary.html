<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Revenue Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Revenue Summary</h1>

    <table class="table table-bordered align-middle">
        <tbody>
        <tr>
            <td>Total Net Invoiced:</td>
            <td th:text="${#numbers.formatDecimal(revenueSummary.totalNetInvoiced, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <td>Total VAT:</td>
            <td th:text="${#numbers.formatDecimal(revenueSummary.totalVat, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <td>Total Gross Invoiced:</td>
            <td th:text="${#numbers.formatDecimal(revenueSummary.totalGrossInvoiced, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <td>Total Received:</td>
            <td th:text="${#numbers.formatDecimal(revenueSummary.totalReceived, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <td>Total Outstanding:</td>
            <td th:text="${#numbers.formatDecimal(revenueSummary.totalOutstanding, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <td>Total Costs:</td>
            <td th:text="${#numbers.formatDecimal(revenueSummary.totalCosts, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <td>Net Revenue Estimate:</td>
            <td th:text="${#numbers.formatDecimal(revenueSummary.netRevenueEstimate, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>

        </tbody>
    </table>

    <div class="mt-3 no-print">
        <button class="btn btn-primary me-2" onclick="window.print()">Print</button>
        <a class="btn btn-secondary" th:href="@{/reports}">Back</a>
    </div>
</div>
</body>
</html>
