<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
        .text-truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Project Summary</h1>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
            <tr>
                <th>Project Title</th>
                <th>Client</th>
                <th>Status</th>
                <th>Start Date</th>
                <th>Assessors</th>
                <th class="text-end">Total Hours</th>
                <th class="text-end">Total Costs (€)</th>
                <th class="text-end">Invoiced (€)</th>
                <th class="text-end">Received (€)</th>
                <th class="text-end">Outstanding (€)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ps : ${projectSummaries}">
                <td th:text="${ps.ProjectTitle}" class="text-truncate"></td>
                <td th:text="${ps.clientName}" class="text-truncate"></td>
                <td th:text="${ps.status}"></td>
                <td th:text="${ps.startDate}"></td>
                <td th:text="${ps.assessorNames}" class="text-truncate"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ps.totalHoursLogged,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ps.totalCosts,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ps.totalInvoicedGross,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ps.totalReceived,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ps.outstandingBalance,1,'COMMA',2,'POINT')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(projectSummaries)}">
                <td colspan="10" class="text-center text-muted">No projects found</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3 no-print">
        <button class="btn btn-primary me-2" onclick="window.print()">Print</button>
        <a class="btn btn-secondary" th:href="@{/reports}">Back</a>
    </div>
</div>
</body>
</html>
