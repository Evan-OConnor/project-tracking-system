<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
        .text-truncate { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Project Reports</h1>
        <a class="btn btn-primary" th:href="@{/projects/reports/new}">+ Upload Report</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead class="table-light">
            <tr>
                <th>Project</th>
                <th>Document Type</th>
                <th>Title</th>
                <th>Uploaded By</th>
                <th>Date Created</th>
                <th>Storage Location</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="report : ${projectReports}">
                <td th:text="${report.projectTitle}" class="text-truncate"></td>
                <td th:text="${report.documentType}"></td>
                <td th:text="${report.title}" class="text-truncate" th:title="${report.title}"></td>
                <td th:text="${report.uploadedBy}"></td>
                <td th:text="${#dates.format(report.dateCreated,'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <a th:href="${report.storageLocation}" target="_blank" class="text-truncate d-block" th:text="${report.storageLocation}"></a>
                </td>
                <td class="text-end">
                    <a class="btn btn-outline-primary btn-sm me-1"
                       th:href="@{'/projects/reports/' + ${report.id} + '/download'}">Download</a>
                    <a class="btn btn-outline-secondary btn-sm me-1"
                       th:href="@{'/projects/reports/' + ${report.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/projects/reports/' + ${report.id} + '/delete'}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('Are you sure you want to delete this report?');">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(projectReports)}">
                <td colspan="7" class="text-center text-muted">No reports found</td>
            </tr>
            </tbody>
        </table>
    </div>
