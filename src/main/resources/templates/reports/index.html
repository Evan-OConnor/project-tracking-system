<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <h2 class="mb-4">Reports</h2>

    <div class="row g-4">

        <div class="col-md-6">
            <div class="card p-3">
                <h5>Client Report</h5>

                <form method="get" th:action="@{/reports/client}">

                    <!-- Search box -->
                    <input type="text" id="clientSearch" class="form-control mb-2"
                           placeholder="Search client..." autocomplete="off">

                    <!-- Hidden field for selected ID -->
                    <input type="hidden" name="clientId" id="clientId">

                    <!-- Results list -->
                    <ul id="resultsList" class="list-group mb-2"></ul>

                    <button class="btn btn-primary w-100">View Report</button>
                </form>
            </div>
        </div>

        <script>
            const searchInput = document.getElementById('clientSearch');
            const resultsList = document.getElementById('resultsList');
            const clientIdInput = document.getElementById('clientId');

            searchInput.addEventListener('keyup', function () {
                const query = this.value;

                if (query.length < 2) {
                    resultsList.innerHTML = '';
                    return;
                }

                fetch('/api/clients/search?query=' + query)
                    .then(response => response.json())
                    .then(data => {
                        resultsList.innerHTML = '';

                        data.forEach(client => {
                            const li = document.createElement('li');
                            li.className = 'list-group-item list-group-item-action';
                            li.textContent = client.name;

                            li.addEventListener('click', () => {
                                searchInput.value = client.name;
                                clientIdInput.value = client.id;
                                resultsList.innerHTML = '';
                            });

                            resultsList.appendChild(li);
                        });
                    });
            });
        </script>

        <div class="col-md-6">
            <div class="card p-3">
                <h5>Timesheet Report</h5>
                <form method="get" th:action="@{/reports/timesheets}">
                    <select name="employeeId" class="form-select mb-2">
                        <option value="">Select Employee</option>
                        <option th:each="e : ${employees}"
                                th:value="${e.id}"
                                th:text="${e.name}">
                        </option>
                    </select>
                    <input type="date" name="from" class="form-control mb-2">
                    <input type="date" name="to" class="form-control mb-2">
                    <button class="btn btn-primary w-100">View Report</button>
                </form>
            </div>
        </div>

        <div class="col-md-6">
            <a th:href="@{/reports/summary}" class="btn btn-outline-dark w-100">
                Financial Summary
            </a>
        </div>

        <div class="col-md-6">
            <a th:href="@{/reports/outstanding-invoices}" class="btn btn-outline-danger w-100">
                Outstanding Invoices
            </a>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
