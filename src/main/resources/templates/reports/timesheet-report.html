<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timesheet Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <h2 class="mb-4">Timesheet Report</h2>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-hover">

            <thead class="table-light">
            <tr>
                <th>Date</th>
                <th>Project</th>
                <th class="text-end">Hours</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="e : ${entries}">
                <td th:text="${#temporals.format(e.entryDate, 'dd MMM yyyy')}"></td>
                <td th:text="${e.project.title}"></td>
                <td class="text-end"
                    th:text="${#numbers.formatDecimal(e.hours,1,'COMMA',2,'POINT')}">
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(entries)}">
                <td colspan="3" class="text-center text-muted py-4">
                    No entries found.
                </td>
            </tr>

            </tbody>

        </table>
    </div>

    <!-- Total -->
    <div class="text-end mt-3">
        <h5>Total Hours:
            <span th:text="${#numbers.formatDecimal(totalHours,1,'COMMA',2,'POINT')}"></span>
        </h5>
    </div>

    <div class="mt-4">
        <h5>Hours by Project</h5>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between"
                th:each="entry : ${hoursByProject}">
                <span th:text="${entry.key}"></span>
                <span th:text="${#numbers.formatDecimal(entry.value,1,'COMMA',2,'POINT')} + ' hrs'"></span>
            </li>
        </ul>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
