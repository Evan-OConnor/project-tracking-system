<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Invoice Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
        .text-truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Invoice Register</h1>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
            <tr>
                <th>Invoice ID</th>
                <th>Invoice Date</th>
                <th>Project</th>
                <th>Client</th>
                <th class="text-end">Net (€)</th>
                <th class="text-end">VAT (€)</th>
                <th class="text-end">Gross (€)</th>
                <th class="text-end">Paid (€)</th>
                <th>Date Received</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="inv : ${invoiceRegisters}">
                <td th:text="${inv.invoiceId}"></td>
                <td th:text="${inv.invoiceDate}"></td>
                <td th:text="${inv.projectTitle}" class="text-truncate"></td>
                <td th:text="${inv.clientName}" class="text-truncate"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(inv.netTotal,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(inv.vatAmount,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(inv.grossTotal,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(inv.amountPaid,1,'COMMA',2,'POINT')}"></td>
                <td th:text="${inv.dateReceived}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(invoiceRegister)}">
                <td colspan="9" class="text-center text-muted">No invoices found</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3 no-print">
        <button class="btn btn-primary me-2" onclick="window.print()">Print</button>
        <a class="btn btn-secondary" th:href="@{/reports}">Back</a>
    </div>
</div>
</body>
</html>
