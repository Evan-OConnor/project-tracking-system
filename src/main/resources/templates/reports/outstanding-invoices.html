<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Outstanding Invoices</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <h2 class="mb-4">Outstanding Invoices</h2>

    <div class="table-responsive">
        <table class="table table-hover">

            <thead class="table-light">
            <tr>
                <th>Client</th>
                <th>Phone</th>
                <th>Invoice</th>
                <th>Invoice Date</th>
                <th class="text-end">Amount (€)</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="i : ${invoices}">
                <td th:text="${i.project.clientContact.name}"></td>
                <td th:text="${i.project.clientContact.phone}"></td>
                <td th:text="${i.invoiceNumber}"></td>
                <td th:text="${#temporals.format(i.invoiceDate,'dd MMM yyyy')}"></td>
                <td class="text-end"
                    th:text="'€' + ${#numbers.formatDecimal(i.TotalExVat,1,'COMMA',2,'POINT')}">
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(invoices)}">
                <td colspan="5" class="text-center text-muted py-4">
                    No outstanding invoices.
                </td>
            </tr>

            </tbody>

        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
