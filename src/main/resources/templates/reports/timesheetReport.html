<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Timesheet & Workload Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
        .text-truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Timesheet & Workload Report</h1>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
            <tr>
                <th>Employee</th>
                <th>Project</th>
                <th>Entry Date</th>
                <th class="text-end">Hours</th>
                <th class="text-end">Hourly Rate (€)</th>
                <th class="text-end">Total (€)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ts : ${timesheetReports}">
                <td th:text="${ts.employeeName}" class="text-truncate"></td>
                <td th:text="${ts.projectTitle}" class="text-truncate"></td>
                <td th:text="${ts.entryDate}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ts.hours,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ts.hourlyRate,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ts.totalChargeable,1,'COMMA',2,'POINT')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(timesheetReports)}">
                <td colspan="6" class="text-center text-muted">No timesheet entries found</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3 no-print">
        <button class="btn btn-primary me-2" onclick="window.print()">Print</button>
        <a class="btn btn-secondary" th:href="@{/reports}">Back</a>
    </div>
</div>
</body>
</html>
