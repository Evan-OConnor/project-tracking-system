<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Client Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <h2 class="mb-4">Client Report</h2>

    <h5 th:text="${client.name}"></h5>

    <!-- Projects -->
    <div class="table-responsive mb-5">
        <h6>Projects</h6>
        <table class="table table-hover">
            <thead class="table-light">
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Start</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${projects}">
                <td th:text="${p.title}"></td>
                <td th:text="${p.status.name}"></td>
                <td th:text="${#temporals.format(p.startDate,'dd MMM yyyy')}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="4" class="text-center text-muted py-4">No projects found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Outstanding Invoices -->
    <div class="table-responsive">
        <h6>Outstanding Invoices</h6>
        <table class="table table-hover">
            <thead class="table-light">
            <tr>
                <th>Invoice No</th>
                <th>Date</th>
                <th class="text-end">Amount (€)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${invoices}">
                <td th:text="${i.invoiceNumber}"></td>
                <td th:text="${#temporals.format(i.invoiceDate,'dd MMM yyyy')}"></td>
                <td class="text-end"
                    th:text="'€' + ${#numbers.formatDecimal(i.TotalExVat,1,'COMMA',2,'POINT')}">
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(invoices)}">
                <td colspan="3" class="text-center text-muted py-4">No outstanding invoices.</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
