<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Summary Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">

    <h2 class="mb-4 text-center">All Clients Summary</h2>

    <!-- 🔷 TOP SUMMARY CARDS -->
    <div class="row g-4 mb-4 text-center">

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h6>Total Projects</h6>
                <h3 th:text="${#aggregates.sum(summaries.![totalProjects])}"></h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h6>Total Invoices</h6>
                <h3 th:text="${#aggregates.sum(summaries.![totalInvoices])}"></h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <h6>Total Receipts</h6>
                <h3 th:text="${#aggregates.sum(summaries.![totalReceipts])}"></h3>
            </div>
        </div>

    </div>

    <!-- 🔷 TABLE -->
    <div class="table-responsive">
        <table class="table table-hover">

            <thead class="table-light">
            <tr>
                <th>Client</th>
                <th>Projects</th>
                <th>Invoices</th>
                <th>Receipts (Paid)</th>
            </tr>
            </thead>

            <tbody>

            <!-- Data rows -->
            <tr th:each="s : ${summaries}">
                <td th:text="${s.clientName}"></td>
                <td th:text="${s.totalProjects}"></td>
                <td th:text="${s.totalInvoices}"></td>
                <td th:text="${s.totalReceipts}"></td>
            </tr>

            <!-- Totals row -->
            <tr class="table-secondary fw-bold" th:if="${!#lists.isEmpty(summaries)}">
                <td>Total</td>
                <td th:text="${#aggregates.sum(summaries.![totalProjects])}"></td>
                <td th:text="${#aggregates.sum(summaries.![totalInvoices])}"></td>
                <td th:text="${#aggregates.sum(summaries.![totalReceipts])}"></td>
            </tr>

            <!-- Empty state -->
            <tr th:if="${#lists.isEmpty(summaries)}">
                <td colspan="4" class="text-center text-muted py-4">
                    No data available.
                </td>
            </tr>

            </tbody>

        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
