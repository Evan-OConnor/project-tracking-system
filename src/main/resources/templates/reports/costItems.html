<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cost & Outlay Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
        .text-truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Cost & Outlay Report</h1>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-primary">
            <tr>
                <th>Project</th>
                <th>Employee</th>
                <th>Cost Date</th>
                <th>Description</th>
                <th class="text-end">Amount (€)</th>
                <th>Type</th>
                <th>Supplier</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ci : ${costItems}">
                <td th:text="${ci.projectTitle}" class="text-truncate"></td>
                <td th:text="${ci.employeeName}" class="text-truncate"></td>
                <td th:text="${ci.costDate}"></td>
                <td th:text="${ci.description}" class="text-truncate"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(ci.costAmount,1,'COMMA',2,'POINT')}"></td>
                <td th:text="${ci.type}"></td>
                <td th:text="${ci.supplierName}" class="text-truncate"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(costItems)}">
                <td colspan="7" class="text-center text-muted">No cost items found</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3 no-print">
        <button class="btn btn-primary me-2" onclick="window.print()">Print</button>
        <a class="btn btn-secondary" th:href="@{/reports}">Back</a>
    </div>
</div>
</body>
</html>
